<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlagK — 料金・費用シミュレーター</title>
</head>
<body>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:     #0E1E30;
  --navy:    #1C3A5E;
  --slate:   #4A647E;
  --horizon: #E4EDF6;
  --sky:     #F0F5FB;
  --accent:   #829CD0;
  --accent-lt:#F1F4FA;
  --ground:  #F4F7FA;
  --white:   #FFFFFF;
  --sep:     #D0DCE8;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", "Noto Sans JP", sans-serif;
  background: var(--ground);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Page header ─────────────────────── */
.page-header {
  background: var(--navy);
  padding: 28px 48px 24px;
  display: flex;
  align-items: baseline;
  gap: 28px;
  border-bottom: 3px solid var(--accent);
}

.brand {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--white);
}

.header-divider {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.2);
  flex-shrink: 0;
  align-self: center;
}

.header-text h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.02em;
  margin-bottom: 2px;
}

.header-text p {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.01em;
}

/* ── Layout ──────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 28px;
  max-width: 1060px;
  margin: 0 auto;
  padding: 28px 24px 48px;
  align-items: start;
}

/* ── Steps (left) ─────────────────────── */
.step { margin-bottom: 32px; }
.step:last-child { margin-bottom: 0; }

.step-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
}

.step-eyebrow {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  background: var(--navy);
  color: var(--white);
  padding: 3px 10px 2px;
  flex-shrink: 0;
}

.step-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
}

.step-back {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--slate);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
  padding: 0;
}
.step-back:hover { color: var(--ink); }

/* Choice cards (step 1) */
.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.choice-card {
  background: var(--white);
  border: 1px solid var(--sep);
  border-left: 3px solid transparent;
  padding: 20px 20px 18px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  user-select: none;
}

.choice-card:hover { background: var(--sky); }

.choice-card.selected {
  border-left-color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-lt);
}

.choice-icon {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--horizon);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}

.choice-card.selected .choice-icon { background: var(--accent); }

.choice-name {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 5px;
}

.choice-desc {
  font-size: 12px;
  color: var(--slate);
  line-height: 1.6;
}

/* Plan cards (step 2 / new) */
.plan-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.plan-card {
  background: var(--white);
  border: 1px solid var(--sep);
  border-left: 3px solid transparent;
  padding: 18px 20px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}

.plan-card:hover { background: var(--sky); }

.plan-card.selected {
  border-left-color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-lt);
}

.plan-card:not(.selectable) { cursor: default; }
.plan-card:not(.selectable):hover { background: var(--white); }

.plan-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 4px;
}

.plan-name {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--ink);
}

.plan-price {
  font-size: 16px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.plan-tagline {
  font-size: 12px;
  color: var(--slate);
  margin-bottom: 14px;
}

.example-groups {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--horizon);
}

.example-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 10px;
  font-size: 11.5px;
  line-height: 1.7;
}

.example-label {
  color: var(--slate);
  font-weight: 700;
  letter-spacing: 0.02em;
  padding-top: 1px;
}

.example-list { color: var(--ink); }
.example-list::before { content: "例）"; color: var(--slate); }

/* Section slider (step 2 / renew) */
.slider-block {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--horizon);
}

.slider-label-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}

.slider-label {
  font-size: 12px;
  color: var(--slate);
  font-weight: 600;
}

.slider-value {
  font-size: 12.5px;
  color: var(--navy);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}

.slider-scale {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--slate);
  margin-top: 4px;
}

.minor-note {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--horizon);
  font-size: 11px;
  color: var(--slate);
  line-height: 1.7;
}

/* ── Estimate panel (right) ──────────── */
.estimate-panel {
  position: sticky;
  top: 20px;
  background: var(--white);
  border: 1px solid var(--sep);
}

.est-header {
  background: var(--navy);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.est-header-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}

.est-header-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.02em;
}

.est-body { padding: 0; }

.est-empty {
  padding: 36px 24px;
  text-align: center;
  border-bottom: 1px solid var(--horizon);
}

.est-empty-icon {
  width: 40px;
  height: 40px;
  margin: 0 auto 12px;
  opacity: 0.25;
}

.est-empty p {
  font-size: 12.5px;
  color: var(--slate);
  line-height: 1.6;
}

.est-selected {
  display: none;
  padding: 18px 20px;
  border-bottom: 1px solid var(--sep);
}

.est-selected.on { display: block; }

.est-selected-kind {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--slate);
  margin-bottom: 6px;
}

.est-selected-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.5;
}

.est-total {
  background: var(--horizon);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--sep);
}

.est-total-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 0.03em;
}

.est-total-amount {
  font-size: 24px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.est-footer { padding: 16px 20px 20px; }

.est-note {
  font-size: 10.5px;
  color: var(--slate);
  line-height: 1.8;
  margin-bottom: 14px;
}

.est-cta {
  display: block;
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: var(--navy);
  font-size: 13.5px;
  font-weight: 700;
  font-family: inherit;
  border: none;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: background 0.12s, color 0.12s;
  margin-bottom: 8px;
}

.est-cta:disabled {
  background: var(--horizon);
  color: var(--slate);
  cursor: not-allowed;
}

.est-cta:not(:disabled):hover { background: var(--navy); color: var(--white); }
.est-cta:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

.est-reset {
  display: block;
  width: 100%;
  padding: 9px;
  background: none;
  border: 1px solid var(--sep);
  color: var(--slate);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.12s, color 0.12s;
}

.est-reset:hover { border-color: var(--slate); color: var(--ink); }
.est-reset:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

/* ── Footer ─────────────────────────── */
.page-footer {
  text-align: center;
  padding: 24px;
  font-size: 11.5px;
  color: var(--slate);
  border-top: 1px solid var(--sep);
}

/* ── Mobile ─────────────────────────── */
@media (max-width: 780px) {
  .page-header { padding: 20px 16px; gap: 16px; flex-wrap: wrap; }
  .header-divider { display: none; }
  .layout { grid-template-columns: 1fr; padding: 16px; gap: 20px; }
  .estimate-panel { position: static; order: -1; }
  .choice-grid { grid-template-columns: 1fr; }
  .example-row { grid-template-columns: 1fr; gap: 2px; }
}

@media (prefers-reduced-motion: reduce) {
  .choice-card, .plan-card, .est-cta, .est-reset { transition: none; }
}
</style>

<header class="page-header">
  <span class="brand">FlagK</span>
  <div class="header-divider"></div>
  <div class="header-text">
    <h1>料金・費用シミュレーター</h1>
    <p>2つの質問にお答えいただくだけで、概算費用がわかります</p>
  </div>
</header>

<div class="layout">
  <!-- Steps -->
  <section>

    <!-- STEP 1 -->
    <div class="step">
      <div class="step-head">
        <span class="step-eyebrow">STEP 1</span>
        <span class="step-title">どちらに近いですか？</span>
      </div>
      <div class="choice-grid" id="choice-grid"></div>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="step2" style="display:none;">
      <div class="step-head">
        <span class="step-eyebrow">STEP 2</span>
        <span class="step-title" id="step2-title"></span>
        <button class="step-back" onclick="goBack()">STEP 1に戻る</button>
      </div>
      <div id="step2-body"></div>
    </div>

  </section>

  <!-- Estimate panel -->
  <aside class="estimate-panel">
    <div class="est-header">
      <div>
        <div class="est-header-label">概算見積もり</div>
        <div class="est-header-title">お見積もり内容</div>
      </div>
    </div>
    <div class="est-body">
      <div class="est-empty" id="empty">
        <svg class="est-empty-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="5" width="24" height="30" rx="1.5" stroke="#1C3A5E" stroke-width="2"/>
          <line x1="13" y1="13" x2="27" y2="13" stroke="#1C3A5E" stroke-width="1.5"/>
          <line x1="13" y1="18" x2="27" y2="18" stroke="#1C3A5E" stroke-width="1.5"/>
          <line x1="13" y1="23" x2="22" y2="23" stroke="#1C3A5E" stroke-width="1.5"/>
        </svg>
        <p>左の質問にお答えください</p>
      </div>
      <div class="est-selected" id="est-selected">
        <div class="est-selected-kind" id="est-selected-kind"></div>
        <div class="est-selected-name" id="est-selected-name"></div>
      </div>
      <div class="est-total" id="est-total-row" style="display:none;">
        <span class="est-total-label">概算金額（税込）</span>
        <span class="est-total-amount" id="total">¥0</span>
      </div>
      <div class="est-footer">
        <p class="est-note">
          ※ 上記はあくまで目安です。実際の作業規模・難易度により変動します。<br>
          ※ 複数のご依頼をまとめる場合や、上記に当てはまらない内容はご相談に応じます。
        </p>
        <button class="est-cta" id="cta-btn" onclick="handleContact()" disabled>この内容でお問い合わせする</button>
        <button class="est-reset" onclick="resetAll()">最初からやり直す</button>
      </div>
    </div>
  </aside>
</div>

<footer class="page-footer">© FlagK — 料金はすべて税込表示です</footer>

<script>
const CONTACT_EMAIL = 'info@flagk-co.jp';

const MODES = [
  {
    id: 'new',
    name: '新規に作りたい',
    desc: 'まだ何もない状態から、LPやホームページを新しく作りたい方はこちら',
  },
  {
    id: 'renew',
    name: '今あるサイトを直したい',
    desc: '公開済みのLP・ホームページのデザインや構成を見直したい方はこちら',
  }
];

const NEW_PLANS = [
  {
    id: 'lp-new',
    name: 'LP（ランディングページ）新規制作',
    tagline: '1枚のページで完結する、広告・集客用ページを作りたい方に',
    price: 30000,
    priceLabel: '¥30,000',
    examples: [
      { label: 'デザイン', text: 'ヒーローセクション、サービス紹介、料金表、お客様の声、FAQ など' },
      { label: '機能',     text: 'お問い合わせフォーム、LINE誘導、アクセス解析の設置 など' }
    ]
  },
  {
    id: 'hp-new',
    name: 'ホームページ新規制作（3〜4ページ）',
    tagline: '複数ページで会社やサービスをきちんと紹介したい方に',
    price: 50000,
    priceLabel: '上限¥50,000',
    examples: [
      { label: 'ページ構成', text: 'トップページ、会社概要、サービス紹介、お問い合わせ など' },
      { label: '機能',       text: 'お問い合わせフォーム、レスポンシブ対応、アクセス解析の設置 など' }
    ]
  }
];

const RENEW_PLAN = {
  id: 'renewal',
  name: 'ホームページ・LP改修',
  tagline: '今のサイトを活かしながら、デザインや構成を見直します',
  priceMin: 20000,
  priceMax: 30000,
  sectionMin: 3,
  sectionMax: 8,
  examples: [
    { label: 'デザイン', text: '配色・フォントの刷新、レイアウトの調整、スマホ表示の最適化 など' },
    { label: '構成',     text: 'セクションの追加・削除・並び替え、ファーストビューの改修 など' },
    { label: '機能',     text: 'フォームの改善、広告タグ・計測タグの設置 など' }
  ]
};

const state = {
  mode: null,       // 'new' | 'renew'
  planId: null,     // for 'new' mode
  sections: 5        // for 'renew' mode
};

function fmtYen(n) {
  return '¥' + Math.round(n).toLocaleString('ja-JP');
}

function renewPrice(sections) {
  const { priceMin, priceMax, sectionMin, sectionMax } = RENEW_PLAN;
  const clamped = Math.min(sectionMax, Math.max(sectionMin, sections));
  const ratio = (clamped - sectionMin) / (sectionMax - sectionMin);
  return priceMin + ratio * (priceMax - priceMin);
}

function exampleGroupsHtml(examples) {
  return `
    <div class="example-groups">
      ${examples.map(g => `
        <div class="example-row">
          <span class="example-label">${g.label}</span>
          <span class="example-list">${g.text}</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ── STEP 1 ── */
function buildChoiceGrid() {
  const root = document.getElementById('choice-grid');
  root.innerHTML = MODES.map(m => `
    <div class="choice-card" id="mode-${m.id}" onclick="selectMode('${m.id}')">
      <div class="choice-icon">
        ${m.id === 'new'
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C3A5E" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C3A5E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/></svg>'}
      </div>
      <div class="choice-name">${m.name}</div>
      <div class="choice-desc">${m.desc}</div>
    </div>
  `).join('');
}

function selectMode(modeId) {
  state.mode = modeId;
  state.planId = null;
  document.querySelectorAll('.choice-card').forEach(el => {
    el.classList.toggle('selected', el.id === 'mode-' + modeId);
  });
  renderStep2();
  renderSummary();
}

/* ── STEP 2 ── */
function renderStep2() {
  const step2 = document.getElementById('step2');
  const title = document.getElementById('step2-title');
  const body  = document.getElementById('step2-body');

  if (!state.mode) { step2.style.display = 'none'; return; }
  step2.style.display = '';

  if (state.mode === 'new') {
    title.textContent = 'どちらのイメージに近いですか？';
    body.innerHTML = `<div class="plan-grid" id="plan-grid"></div>`;
    const grid = document.getElementById('plan-grid');
    grid.innerHTML = NEW_PLANS.map(p => `
      <div class="plan-card selectable" id="plan-${p.id}" onclick="selectPlan('${p.id}')">
        <div class="plan-top">
          <span class="plan-name">${p.name}</span>
          <span class="plan-price">${p.priceLabel}</span>
        </div>
        <div class="plan-tagline">${p.tagline}</div>
        ${exampleGroupsHtml(p.examples)}
      </div>
    `).join('');
    if (state.planId) {
      document.getElementById('plan-' + state.planId)?.classList.add('selected');
    }
  } else {
    title.textContent = '今のサイトのセクション数を教えてください';
    const price = renewPrice(state.sections);
    body.innerHTML = `
      <div class="plan-card">
        <div class="plan-top">
          <span class="plan-name">${RENEW_PLAN.name}</span>
          <span class="plan-price">${fmtYen(price)}</span>
        </div>
        <div class="plan-tagline">${RENEW_PLAN.tagline}</div>
        <div class="slider-block">
          <div class="slider-label-row">
            <span class="slider-label">現在のセクション数</span>
            <span class="slider-value" id="section-value">${state.sections}個</span>
          </div>
          <input type="range" id="section-slider"
                 min="${RENEW_PLAN.sectionMin}" max="${RENEW_PLAN.sectionMax}" step="1"
                 value="${state.sections}" oninput="updateSections(this.value)">
          <div class="slider-scale">
            <span>${RENEW_PLAN.sectionMin}個〜（${fmtYen(RENEW_PLAN.priceMin)}）</span>
            <span>${RENEW_PLAN.sectionMax}個以上（${fmtYen(RENEW_PLAN.priceMax)}）</span>
          </div>
        </div>
        ${exampleGroupsHtml(RENEW_PLAN.examples)}
        <p class="minor-note">
          ※ テキスト修正や画像の差し替えなど軽微な変更のみの場合は、内容に応じて別途無料〜数千円程度でご案内します。
        </p>
      </div>
    `;
    state.planId = RENEW_PLAN.id;
  }
}

function selectPlan(planId) {
  state.planId = planId;
  document.querySelectorAll('.plan-card.selectable').forEach(el => {
    el.classList.toggle('selected', el.id === 'plan-' + planId);
  });
  renderSummary();
}

function updateSections(val) {
  state.sections = parseInt(val, 10);
  document.getElementById('section-value').textContent = state.sections + '個';
  const price = renewPrice(state.sections);
  document.querySelector('#step2-body .plan-price').textContent = fmtYen(price);
  renderSummary();
}

/* ── Summary panel ── */
function getCurrentSelection() {
  if (state.mode === 'new' && state.planId) {
    const plan = NEW_PLANS.find(p => p.id === state.planId);
    return plan ? { kind: '新規制作', name: plan.name, amount: plan.price, label: plan.priceLabel } : null;
  }
  if (state.mode === 'renew') {
    const amount = renewPrice(state.sections);
    return { kind: '既存サイトの改修', name: `${RENEW_PLAN.name}（セクション数：${state.sections}個）`, amount, label: fmtYen(amount) };
  }
  return null;
}

function renderSummary() {
  const emptyEl    = document.getElementById('empty');
  const selEl      = document.getElementById('est-selected');
  const kindEl     = document.getElementById('est-selected-kind');
  const nameEl     = document.getElementById('est-selected-name');
  const totalRow   = document.getElementById('est-total-row');
  const totalEl    = document.getElementById('total');
  const ctaBtn     = document.getElementById('cta-btn');

  const sel = getCurrentSelection();

  if (!sel) {
    emptyEl.style.display = '';
    selEl.classList.remove('on');
    totalRow.style.display = 'none';
    ctaBtn.disabled = true;
    return;
  }

  emptyEl.style.display = 'none';
  selEl.classList.add('on');
  kindEl.textContent = sel.kind;
  nameEl.textContent = sel.name;
  totalRow.style.display = 'flex';
  totalEl.textContent = sel.label;
  ctaBtn.disabled = false;
}

function goBack() {
  state.mode = null;
  state.planId = null;
  document.querySelectorAll('.choice-card').forEach(el => el.classList.remove('selected'));
  document.getElementById('step2').style.display = 'none';
  renderSummary();
}

function resetAll() {
  state.mode = null;
  state.planId = null;
  state.sections = 5;
  document.querySelectorAll('.choice-card').forEach(el => el.classList.remove('selected'));
  document.getElementById('step2').style.display = 'none';
  renderSummary();
}

function handleContact() {
  const sel = getCurrentSelection();
  if (!sel) return;
  const subject = 'FlagK 料金シミュレーターからのお問い合わせ';
  const body =
    `料金シミュレーターで以下の内容を選択しました。\n\n` +
    `分類：${sel.kind}\n` +
    `内容：${sel.name}\n` +
    `概算金額：${sel.label}\n\n` +
    `--\nご記入ください\n店舗名・会社名：\nお名前：\n電話番号：\n`;
  window.location.href =
    `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

buildChoiceGrid();
renderSummary();
</script>
</body>
</html>
