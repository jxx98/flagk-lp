<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlagK — 料金・費用シミュレーター</title>
</head>
<body>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:     #0E1E30;
  --navy:    #1C3A5E;
  --slate:   #4A647E;
  --horizon: #E4EDF6;
  --sky:     #F0F5FB;
  --accent:   #829CD0;
  --accent-lt:#F1F4FA;
  --ground:  #F4F7FA;
  --white:   #FFFFFF;
  --sep:     #D0DCE8;
  --free-bg: #EBF5EC;
  --free-fg: #2C7A35;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", "Noto Sans JP", sans-serif;
  background: var(--ground);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Page header ─────────────────────── */
.page-header {
  background: var(--navy);
  padding: 28px 48px 24px;
  display: flex;
  align-items: baseline;
  gap: 28px;
  border-bottom: 3px solid var(--accent);
}

.brand {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--white);
}

.header-divider {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.2);
  flex-shrink: 0;
  align-self: center;
}

.header-text h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.02em;
  margin-bottom: 2px;
}

.header-text p {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.01em;
}

/* ── Layout ──────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 28px;
  max-width: 1060px;
  margin: 0 auto;
  padding: 28px 24px 48px;
  align-items: start;
}

/* ── Steps (left) ─────────────────────── */
.step { margin-bottom: 32px; }
.step:last-child { margin-bottom: 0; }

.step-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
}

.step-eyebrow {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  background: var(--navy);
  color: var(--white);
  padding: 3px 10px 2px;
  flex-shrink: 0;
}

.step-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
}

.step-back {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--slate);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
  padding: 0;
}
.step-back:hover { color: var(--ink); }

/* Choice cards (step 1) */
.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.choice-card {
  background: var(--white);
  border: 1px solid var(--sep);
  border-left: 3px solid transparent;
  padding: 20px 20px 18px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  user-select: none;
}

.choice-card:hover { background: var(--sky); }

.choice-card.selected {
  border-left-color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-lt);
}

.choice-icon {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--horizon);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}

.choice-card.selected .choice-icon { background: var(--accent); }

.choice-name {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 5px;
}

.choice-desc {
  font-size: 12px;
  color: var(--slate);
  line-height: 1.6;
}

/* Plan cards (step 2 / new) */
.plan-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.plan-card {
  background: var(--white);
  border: 1px solid var(--sep);
  border-left: 3px solid transparent;
  padding: 18px 20px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}

.plan-card:hover { background: var(--sky); }

.plan-card.selected {
  border-left-color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-lt);
}

.plan-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 4px;
}

.plan-name {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--ink);
}

.plan-price {
  font-size: 16px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.plan-tagline {
  font-size: 12px;
  color: var(--slate);
  margin-bottom: 14px;
}

.example-groups {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--horizon);
}

.example-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 10px;
  font-size: 11.5px;
  line-height: 1.7;
}

.example-label {
  color: var(--slate);
  font-weight: 700;
  letter-spacing: 0.02em;
  padding-top: 1px;
}

.example-list { color: var(--ink); }
.example-list::before { content: "例）"; color: var(--slate); }

/* Granular catalog (step 2 / renew) */
.catalog-intro {
  font-size: 12px;
  color: var(--slate);
  margin-bottom: 20px;
  line-height: 1.7;
}

.catalog-intro strong { color: var(--ink); font-weight: 600; }

.category { margin-bottom: 24px; }
.category:last-child { margin-bottom: 0; }

.category-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.cat-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--navy);
  color: var(--white);
  padding: 3px 10px 2px;
  flex-shrink: 0;
}

.cat-desc {
  font-size: 11.5px;
  color: var(--slate);
  margin-bottom: 8px;
  padding-left: 2px;
}

.cat-rule {
  flex: 1;
  border: none;
  border-top: 1px solid var(--sep);
}

.service-items { display: flex; flex-direction: column; gap: 2px; }

.svc {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 13px 14px;
  background: var(--white);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  user-select: none;
}

.svc:hover { background: var(--sky); }

.svc.selected {
  border-left-color: var(--accent);
  background: var(--accent-lt);
}

.svc input[type="checkbox"] {
  width: 15px;
  height: 15px;
  margin-top: 2px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

.svc-info { min-width: 0; }

.svc-name {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
}

.svc-desc {
  font-size: 11.5px;
  color: var(--slate);
  margin-top: 3px;
  line-height: 1.5;
}

.qty-row {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--horizon);
}

.qty-row.on { display: flex; }

.qty-row label {
  font-size: 11.5px;
  color: var(--slate);
  white-space: nowrap;
}

.qty-row input[type="number"] {
  width: 52px;
  padding: 3px 6px;
  border: 1px solid var(--sep);
  background: var(--white);
  font-size: 13px;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: var(--ink);
}

.qty-row input[type="number"]:focus {
  outline: 2px solid var(--accent);
  border-color: transparent;
}

.qty-sub {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.svc-price-col {
  text-align: right;
  flex-shrink: 0;
  padding-top: 1px;
}

.svc-price {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  display: block;
}

.svc-price.free-tag {
  font-size: 11px;
  font-weight: 700;
  color: var(--free-fg);
  background: var(--free-bg);
  padding: 2px 7px;
  letter-spacing: 0.04em;
}

.svc-unit {
  font-size: 10.5px;
  color: var(--slate);
  margin-top: 2px;
  text-align: right;
}

/* ── Estimate panel (right) ──────────── */
.estimate-panel {
  position: sticky;
  top: 20px;
  background: var(--white);
  border: 1px solid var(--sep);
}

.est-header {
  background: var(--navy);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.est-header-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}

.est-header-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.02em;
}

.est-badge {
  font-size: 11px;
  font-weight: 700;
  background: var(--accent);
  color: var(--navy);
  border-radius: 9999px;
  padding: 2px 9px;
  display: none;
  font-variant-numeric: tabular-nums;
}

.est-badge.on { display: block; }

.est-body { padding: 0; }

.est-empty {
  padding: 36px 24px;
  text-align: center;
  border-bottom: 1px solid var(--horizon);
}

.est-empty-icon {
  width: 40px;
  height: 40px;
  margin: 0 auto 12px;
  opacity: 0.25;
}

.est-empty p {
  font-size: 12.5px;
  color: var(--slate);
  line-height: 1.6;
}

.est-selected {
  display: none;
  padding: 18px 20px;
  border-bottom: 1px solid var(--sep);
}

.est-selected.on { display: block; }

.est-selected-kind {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--slate);
  margin-bottom: 6px;
}

.est-selected-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.5;
}

.est-lines {
  display: none;
  flex-direction: column;
  border-bottom: 1px solid var(--sep);
}

.est-lines.on { display: flex; }

.est-line {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: baseline;
  padding: 10px 20px;
  border-bottom: 1px solid var(--horizon);
}

.est-line:last-child { border-bottom: none; }

.est-line-name {
  font-size: 12.5px;
  color: var(--ink);
  font-weight: 500;
}

.est-line-qty {
  font-size: 11px;
  color: var(--slate);
  margin-top: 2px;
}

.est-line-amount {
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.est-line-amount.free {
  font-size: 11px;
  font-weight: 700;
  color: var(--free-fg);
}

.est-total {
  background: var(--horizon);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--sep);
}

.est-total-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 0.03em;
}

.est-total-amount {
  font-size: 24px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.est-footer { padding: 16px 20px 20px; }

.est-note {
  font-size: 10.5px;
  color: var(--slate);
  line-height: 1.8;
  margin-bottom: 14px;
}

.est-cta {
  display: block;
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: var(--navy);
  font-size: 13.5px;
  font-weight: 700;
  font-family: inherit;
  border: none;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: background 0.12s, color 0.12s;
  margin-bottom: 8px;
}

.est-cta:disabled {
  background: var(--horizon);
  color: var(--slate);
  cursor: not-allowed;
}

.est-cta:not(:disabled):hover { background: var(--navy); color: var(--white); }
.est-cta:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

.est-reset {
  display: block;
  width: 100%;
  padding: 9px;
  background: none;
  border: 1px solid var(--sep);
  color: var(--slate);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.12s, color 0.12s;
}

.est-reset:hover { border-color: var(--slate); color: var(--ink); }
.est-reset:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

/* ── Footer ─────────────────────────── */
.page-footer {
  text-align: center;
  padding: 24px;
  font-size: 11.5px;
  color: var(--slate);
  border-top: 1px solid var(--sep);
}

/* ── Mobile ─────────────────────────── */
@media (max-width: 780px) {
  .page-header { padding: 20px 16px; gap: 16px; flex-wrap: wrap; }
  .header-divider { display: none; }
  .layout { grid-template-columns: 1fr; padding: 16px; gap: 20px; }
  .estimate-panel { position: static; order: -1; }
  .choice-grid { grid-template-columns: 1fr; }
  .example-row { grid-template-columns: 1fr; gap: 2px; }
  .svc { grid-template-columns: 18px 1fr auto; gap: 8px; padding: 11px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .choice-card, .plan-card, .svc, .est-cta, .est-reset { transition: none; }
}
</style>

<header class="page-header">
  <span class="brand">FlagK</span>
  <div class="header-divider"></div>
  <div class="header-text">
    <h1>料金・費用シミュレーター</h1>
    <p>2つの質問にお答えいただくだけで、概算費用がわかります</p>
  </div>
</header>

<div class="layout">
  <!-- Steps -->
  <section>

    <div class="step">

      </div>
      <div id="step2-body"></div>
    </div>

  </section>

  <!-- Estimate panel -->
  <aside class="estimate-panel">
    <div class="est-header">
      <div>
        <div class="est-header-label">概算見積もり</div>
        <div class="est-header-title">お見積もり内容</div>
      </div>
      <span class="est-badge" id="badge">0件</span>
    </div>
    <div class="est-body">
      <div class="est-empty" id="empty">
        <svg class="est-empty-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="5" width="24" height="30" rx="1.5" stroke="#1C3A5E" stroke-width="2"/>
          <line x1="13" y1="13" x2="27" y2="13" stroke="#1C3A5E" stroke-width="1.5"/>
          <line x1="13" y1="18" x2="27" y2="18" stroke="#1C3A5E" stroke-width="1.5"/>

        </svg>
        <p>左の質問にお答えください</p>
      </div>
      <div class="est-selected" id="est-selected">
        <div class="est-selected-kind" id="est-selected-kind"></div>
        <div class="est-selected-name" id="est-selected-name"></div>
      </div>
      <div class="est-lines" id="lines"></div>
      <div class="est-total" id="est-total-row" style="display:none;">
        <span class="est-total-label">概算金額（税込）</span>
        <span class="est-total-amount" id="total">¥0</span>
      </div>
      <div class="est-footer">
        <p class="est-note">
          ※ 上記はあくまで目安です。実際の作業規模・難易度により変動します。<br>
          ※ 複数のご依頼をまとめる場合や、上記に当てはまらない内容はご相談に応じます。
        </p>
        <button class="est-cta" id="cta-btn" onclick="handleContact()" disabled>この内容でお問い合わせする</button>
        <button class="est-reset" onclick="resetAll()">最初からやり直す</button>
      </div>
    </div>
  </aside>
</div>

<footer class="page-footer">© FlagK — 料金はすべて税込表示です</footer>

      { id: 'sec-add',  name: '新規セクションの追加',          desc: '実績・FAQ・料金表など新しいセクションのデザイン・実装',        price: 10000, unit: '個'  },
      { id: 'sec-del',  name: 'セクションの削除・並び替え',    desc: '不要セクションの削除や表示順序の変更',                        price: 3000,  unit: null },
      { id: 'hero',     name: 'ファーストビューの改修',        desc: 'ヒーローエリアのデザイン・コピー・CTAを全面改修',              price: 15000, unit: null },
      { id: 'cta',      name: 'CTAの追加・最適化',             desc: '問い合わせボタン・フォームへの導線の追加・改善',               price: 5000,  unit: null }
    ]
  },
  {
    id: 'form',
    label: 'フォーム・問い合わせ',
    desc: 'フォームや送信機能の作業',
    items: [
      { id: 'form-item',   name: 'フォーム項目の追加・変更',   desc: '入力項目の追加・削除・ラベル変更・並び替え',               price: 5000,  unit: null },
      { id: 'form-action', name: '送信後の動作変更',            desc: 'サンクスページの変更・自動返信メール文の修正',              price: 5000,  unit: null },
      { id: 'form-new',    name: '新規フォームの作成',          desc: '問い合わせ・資料請求・予約フォームの設計・実装・メール通知', price: 15000, unit: null },
      { id: 'form-sheet',  name: 'スプレッドシート自動記録',    desc: 'フォーム送信内容をGoogleスプレッドシートに自動記録',        price: 10000, unit: null }
    ]
  },
  {
    id: 'tracking',
    label: '計測・広告連携',
    desc: 'アクセス解析・広告タグの設定',
    items: [
      { id: 'ga4',     name: 'Google Analytics 4（GA4）設置',   desc: 'GA4計測コードの設置と基本イベントの設定',               price: 8000,  unit: null },
      { id: 'gads-cv', name: 'Google広告 コンバージョン設定',   desc: 'CVタグの設置・フォーム連携・計測テスト',                price: 10000, unit: null },
      { id: 'gtm',     name: 'GTM（タグマネージャー）設定',     desc: 'GTMコンテナの設置・タグ管理の設定',                     price: 10000, unit: null },
      { id: 'meta-px', name: 'Meta広告 ピクセル設置',           desc: 'Metaピクセルの設置・コンバージョンイベント設定',         price: 8000,  unit: null }
    ]
  }
];

const RENEW_ITEM_MAP = {};
RENEW_CATEGORIES.forEach(cat => cat.items.forEach(item => { RENEW_ITEM_MAP[item.id] = item; }));

const state = {
  mode: null,               // 'new' | 'renew'
  planId: null,             // for 'new' mode
  renewSelected: new Map()  // for 'renew' mode: itemId -> qty
};

function fmtYen(n) {
  return '¥' + Math.round(n).toLocaleString('ja-JP');
}

function exampleGroupsHtml(examples) {
  return `
    <div class="example-groups">
      ${examples.map(g => `
        <div class="example-row">
          <span class="example-label">${g.label}</span>
          <span class="example-list">${g.text}</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ── STEP 1 ── */
function buildChoiceGrid() {
  const root = document.getElementById('choice-grid');
  root.innerHTML = MODES.map(m => `
    <div class="choice-card" id="mode-${m.id}" onclick="selectMode('${m.id}')">
      <div class="choice-icon">
        ${m.id === 'new'
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C3A5E" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C3A5E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/></svg>'}
      </div>
      <div class="choice-name">${m.name}</div>
      <div class="choice-desc">${m.desc}</div>
    </div>
  `).join('');
}

function selectMode(modeId) {
  state.mode = modeId;
  state.planId = null;
  state.renewSelected.clear();
  document.querySelectorAll('.choice-card').forEach(el => {
    el.classList.toggle('selected', el.id === 'mode-' + modeId);
  });
  renderStep2();
  renderSummary();
}

/* ── STEP 2 ── */
function renderStep2() {
  const step2 = document.getElementById('step2');
  const title = document.getElementById('step2-title');
  const body  = document.getElementById('step2-body');

  if (!state.mode) { step2.style.display = 'none'; return; }
  step2.style.display = '';

  if (state.mode === 'new') {
    title.textContent = 'どちらのイメージに近いですか？';
    body.innerHTML = `<div class="plan-grid" id="plan-grid"></div>`;
    const grid = document.getElementById('plan-grid');
    grid.innerHTML = NEW_PLANS.map(p => `
      <div class="plan-card" id="plan-${p.id}" onclick="selectPlan('${p.id}')">
        <div class="plan-top">
          <span class="plan-name">${p.name}</span>
          <span class="plan-price">${p.priceLabel}</span>
        </div>
        <div class="plan-tagline">${p.tagline}</div>
        ${exampleGroupsHtml(p.examples)}
      </div>
    `).join('');
    if (state.planId) {
      document.getElementById('plan-' + state.planId)?.classList.add('selected');
    }
  } else {
    title.textContent = '直したい内容を選んでください';
    body.innerHTML = `
      <p class="catalog-intro">
        各項目をクリックして選択してください。<strong>複数選択可能</strong>です。
        選んだ項目の合計金額が、右側の概算金額になります。
      </p>
      <div id="renew-catalog"></div>
    `;
    buildRenewCatalog();
  }
}

function selectPlan(planId) {
  state.planId = planId;
  document.querySelectorAll('.plan-card').forEach(el => {
    el.classList.toggle('selected', el.id === 'plan-' + planId);
  });
  renderSummary();
}

/* ── Renew catalog (granular multi-select) ── */
function buildRenewCatalog() {
  const root = document.getElementById('renew-catalog');
  root.innerHTML = '';

  RENEW_CATEGORIES.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'category';

    const hdr = document.createElement('div');
    hdr.className = 'category-header';
    hdr.innerHTML = `<span class="cat-label">${cat.label}</span><hr class="cat-rule">`;
    section.appendChild(hdr);

    if (cat.desc) {
      const descEl = document.createElement('p');
      descEl.className = 'cat-desc';
      descEl.textContent = cat.desc;
      section.appendChild(descEl);
    }

    const list = document.createElement('div');
    list.className = 'service-items';
    section.appendChild(list);

    cat.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'svc';
      row.id = 'svc-' + item.id;

      const priceHtml = item.price === 0
        ? `<span class="svc-price free-tag">無料</span>`
        : `<span class="svc-price">${fmtYen(item.price)}</span>${item.unit ? `<div class="svc-unit">/ ${item.unit}</div>` : ''}`;

      row.innerHTML = `
        <input type="checkbox" id="chk-${item.id}">
        <div class="svc-info">
          <div class="svc-name">${item.name}</div>
          <div class="svc-desc">${item.desc}</div>
          ${item.unit ? `
            <div class="qty-row" id="qrow-${item.id}">
              <label for="qty-${item.id}">${item.unit}数</label>
              <input type="number" id="qty-${item.id}" min="1" max="99" value="1">
              <span class="qty-sub" id="qsub-${item.id}">${fmtYen(item.price)}</span>
            </div>` : ''}
        </div>
        <div class="svc-price-col">${priceHtml}</div>
      `;

      list.appendChild(row);

      const chk = row.querySelector('input[type="checkbox"]');

      chk.addEventListener('change', () => {
        setRenewItem(item, chk.checked);
        row.classList.toggle('selected', chk.checked);
        if (item.unit) {
          row.querySelector('#qrow-' + item.id).classList.toggle('on', chk.checked);
        }
      });

      if (item.unit) {
        const qInput = row.querySelector('#qty-' + item.id);
        qInput.addEventListener('input', () => {
          const q = Math.max(1, parseInt(qInput.value) || 1);
          qInput.value = q;
          if (state.renewSelected.has(item.id)) {
            state.renewSelected.set(item.id, q);
            row.querySelector('#qsub-' + item.id).textContent = fmtYen(item.price * q);
            renderSummary();
          }
        });
        qInput.addEventListener('click', e => e.stopPropagation());
        qInput.addEventListener('change', e => e.stopPropagation());
      }

      row.addEventListener('click', e => {
        if (e.target.tagName === 'INPUT') return;
        chk.checked = !chk.checked;
        chk.dispatchEvent(new Event('change'));
      });
    });

    root.appendChild(section);
  });
}

function setRenewItem(item, on) {
  if (on) {
    const qEl = document.getElementById('qty-' + item.id);
    state.renewSelected.set(item.id, item.unit ? (parseInt(qEl?.value) || 1) : 1);
  } else {
    state.renewSelected.delete(item.id);
  }
  renderSummary();
}

/* ── Summary panel ── */
function renderSummary() {
  const emptyEl    = document.getElementById('empty');
  const selEl      = document.getElementById('est-selected');
  const kindEl     = document.getElementById('est-selected-kind');
  const nameEl     = document.getElementById('est-selected-name');
  const linesEl    = document.getElementById('lines');
  const totalRow   = document.getElementById('est-total-row');
  const totalEl    = document.getElementById('total');
  const badgeEl    = document.getElementById('badge');
  const ctaBtn     = document.getElementById('cta-btn');

  if (state.mode === 'new') {
    badgeEl.classList.remove('on');
    linesEl.classList.remove('on');
    linesEl.innerHTML = '';

    const plan = NEW_PLANS.find(p => p.id === state.planId);
    if (!plan) {
      emptyEl.style.display = '';
      selEl.classList.remove('on');
      totalRow.style.display = 'none';
      ctaBtn.disabled = true;
      return;
    }
    emptyEl.style.display = 'none';
    selEl.classList.add('on');
    kindEl.textContent = '新規制作';
    nameEl.textContent = plan.name;
    totalRow.style.display = 'flex';
    totalEl.textContent = plan.priceLabel;
    ctaBtn.disabled = false;
    return;
  }

  if (state.mode === 'renew') {
    selEl.classList.remove('on');

    const count = state.renewSelected.size;
    badgeEl.textContent = count + '件';
    badgeEl.classList.toggle('on', count > 0);

    if (count === 0) {
      emptyEl.style.display = '';
      linesEl.classList.remove('on');
      linesEl.innerHTML = '';
      totalRow.style.display = 'none';
      ctaBtn.disabled = true;
      return;
    }

    emptyEl.style.display = 'none';
    linesEl.classList.add('on');
    linesEl.innerHTML = '';

    let total = 0;
    state.renewSelected.forEach((qty, id) => {
      const item = RENEW_ITEM_MAP[id];
      if (!item) return;
      const amount = item.price * qty;
      total += amount;

      const line = document.createElement('div');
      line.className = 'est-line';
      const amtCls = item.price === 0 ? 'est-line-amount free' : 'est-line-amount';
      const amtTxt = item.price === 0 ? '無料' : fmtYen(amount);
      const qtyTxt = item.unit && qty > 1 ? `${qty} ${item.unit}` : '';
      line.innerHTML = `
        <div>
          <div class="est-line-name">${item.name}</div>
          ${qtyTxt ? `<div class="est-line-qty">${qtyTxt}</div>` : ''}
        </div>
        <div class="${amtCls}">${amtTxt}</div>
      `;
      linesEl.appendChild(line);
    });

    totalRow.style.display = 'flex';
    totalEl.textContent = fmtYen(total);
    ctaBtn.disabled = false;
    return;
  }

  // no mode selected yet
  badgeEl.classList.remove('on');
  emptyEl.style.display = '';
  selEl.classList.remove('on');
  linesEl.classList.remove('on');
  linesEl.innerHTML = '';
  totalRow.style.display = 'none';
  ctaBtn.disabled = true;
}

function goBack() {
  state.mode = null;
  state.planId = null;
  state.renewSelected.clear();
  document.querySelectorAll('.choice-card').forEach(el => el.classList.remove('selected'));
  document.getElementById('step2').style.display = 'none';
  renderSummary();
}

function resetAll() {
  goBack();
}

function handleContact() {
  let subject, body;

  if (state.mode === 'new') {
    const plan = NEW_PLANS.find(p => p.id === state.planId);
    if (!plan) return;
    subject = 'FlagK 料金シミュレーターからのお問い合わせ';
    body =
      `料金シミュレーターで以下の内容を選択しました。\n\n` +
      `分類：新規制作\n` +
      `内容：${plan.name}\n` +
      `概算金額：${plan.priceLabel}\n\n` +
      `--\nご記入ください\n店舗名・会社名：\nお名前：\n電話番号：\n`;
  } else if (state.mode === 'renew' && state.renewSelected.size > 0) {
    const lines = [];
    let total = 0;
    state.renewSelected.forEach((qty, id) => {
      const item = RENEW_ITEM_MAP[id];
      if (!item) return;
      total += item.price * qty;
      lines.push(item.unit ? `・${item.name}（${qty}${item.unit}）` : `・${item.name}`);
    });
    subject = 'FlagK 料金シミュレーターからのお問い合わせ';
    body =
      `料金シミュレーターで以下の内容を選択しました。\n\n` +
      `分類：既存サイトの改修\n` +
      `内容：\n${lines.join('\n')}\n\n` +
      `概算金額：${fmtYen(total)}\n\n` +
      `--\nご記入ください\n店舗名・会社名：\nお名前：\n電話番号：\n`;
  } else {
    return;
  }

  window.location.href =
    `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

buildChoiceGrid();
renderSummary();
</script>
