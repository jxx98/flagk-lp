<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャンペーン確認フォーム | FlagK Co., Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{width:100%;margin:0;padding:0;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f5f7f6;color:#333}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}

/* ── HEADER ── */
.hd{position:fixed;top:0;left:0;right:0;width:100%;z-index:1000;background:#fff;border-bottom:3px solid #06C167}
/* ── モバイル ── */
.hd-inner{display:flex;align-items:center;gap:6px;width:100%;padding:0 10px;height:56px;max-width:1200px;margin:0 auto}
.hd-logo{display:flex;align-items:center;flex-shrink:0}
.hd-logo img{height:44px;width:auto}
.hd-divider{width:1px;height:36px;background:#e0e0e0;flex-shrink:0}
.hd-brand{display:flex;align-items:center;min-width:0;flex-shrink:1}
.hd-brand-main{font-size:15px;font-weight:700;color:#111;white-space:nowrap;line-height:1.3}
.hd-brand-ue{color:#111}
.hd-brand-sub{font-size:10px;color:#888;white-space:nowrap;margin-top:2px}
.hd-brand-small{font-size:10px;font-weight:700;color:#111}
.hd-brand-sep{color:#ccc;margin:0 4px;font-weight:300}
.hd-brand-sub2{font-size:10px;color:#888;font-weight:400}
.hd-spacer{flex:1;min-width:6px;max-width:24px}
.hd-tel{display:none;align-items:center;flex-shrink:0}
.hd-tel-link{display:inline-flex;align-items:center;gap:6px;background:#06C167;color:#fff;font-size:13px;font-weight:700;padding:10px 12px;border-radius:8px;white-space:nowrap;letter-spacing:.02em;text-decoration:none}
.hd-tel-link img{height:15px;width:auto;flex-shrink:0}
.hd-tel-link:hover{background:#04a857}
.hd-btns{display:none;gap:6px;align-items:center;flex-shrink:0}
.hd-btn{display:inline-flex;align-items:center;gap:5px;padding:9px 12px;border-radius:8px;border:1.5px solid #06C167;cursor:pointer;background:#fff;color:#111;font-size:13px;font-weight:700;font-family:inherit;white-space:nowrap;text-decoration:none;transition:all .2s}
.hd-line-icon{width:15px;height:15px;flex-shrink:0;object-fit:contain}
@media(max-width:359px){
  .hd-divider{display:none}
  .hd-brand{display:none}
  .hd-spacer{max-width:4px}
}
@media(min-width:900px){
  .hd-inner{gap:14px;padding:0 28px;height:56px}
  .hd-tel{display:flex}
  .hd-btns{display:flex}
  .hd-logo img{height:48px}
  .hd-divider{height:36px}
  .hd-brand-main{font-size:17px}
  .hd-brand-sub{font-size:11px;margin-top:3px}
  .hd-spacer{max-width:none}
  .hd-tel-link{font-size:15px;padding:11px 18px;gap:7px}
  .hd-tel-link img{height:17px}
  .hd-btn{font-size:15px;padding:10px 16px;gap:5px}
  .hd-line-icon{width:17px;height:17px}
}


/* ── HERO ── */
.hero-wrap{margin-top:56px;text-align:center}
.hero-img{width:100%;display:block;margin:0;
  -webkit-mask-image:linear-gradient(to bottom,black 97%,transparent 100%);
  mask-image:linear-gradient(to bottom,black 97%,transparent 100%)}
@media(min-width:601px){
  .hero-img{width:auto;max-height:580px;max-width:100%;display:inline-block;margin:0 auto;
    -webkit-mask-image:linear-gradient(to bottom,black 97%,transparent 100%),linear-gradient(to right,black 80%,transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to bottom,black 97%,transparent 100%),linear-gradient(to right,black 80%,transparent 100%);
    mask-composite:intersect}
}

/* ── FORM SECTION TITLE ── */
.form-section-wrap{text-align:center;padding:28px 16px 4px}
.form-section-title{font-size:clamp(18px,3vw,22px);font-weight:700;color:#111;display:inline-flex;align-items:center;gap:10px;letter-spacing:.02em}
.form-title-hl{color:#06C167}
.form-title-deco{color:#06C167;font-size:1em;flex-shrink:0}
.form-section-sub{text-align:center;font-size:14px;color:#06C167;font-weight:700;margin-top:4px;margin-bottom:0}

/* ── FORM PANEL ── */
.form-wrap{max-width:600px;margin:0 auto;padding:16px 16px 56px}
.panel{background:#fff;border-radius:16px;box-shadow:0 4px 28px rgba(0,0,0,.10);padding:32px 32px 36px}
@media(max-width:480px){.panel{padding:24px 16px 28px}}

/* ── FORM ROWS ── */
.f-row{margin-bottom:22px}
.f-lbl{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;font-weight:700;color:#222}
.f-lbl-icon{width:32px;height:32px;border-radius:50%;background:#e8faf2;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.f-lbl-icon svg{width:17px;height:17px}
.f-req{display:inline-block;font-size:10px;font-weight:700;background:#06C167;color:#fff;padding:2px 7px;border-radius:3px;flex-shrink:0}
.f-opt{display:inline-block;font-size:10px;font-weight:700;background:#aaa;color:#fff;padding:2px 7px;border-radius:3px;flex-shrink:0}
.f-input,.f-select,.f-textarea{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:13px 14px;font-size:15px;font-family:inherit;color:#111;background:#fafafa;transition:border-color .2s,background .2s;outline:none}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:#06C167;background:#fff;box-shadow:0 0 0 3px rgba(6,193,103,.12)}
.f-input::placeholder,.f-textarea::placeholder{color:#ccc}
.f-textarea{min-height:80px;resize:vertical;line-height:1.6}
.f-sel-wrap{position:relative}
.f-sel-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#888;pointer-events:none;font-size:13px}
.f-select{padding-right:36px;cursor:pointer;appearance:none;-webkit-appearance:none}

/* ── PRIVACY ── */
.f-privacy{display:flex;align-items:center;gap:8px;margin:24px 0 22px;font-size:13px;color:#555;line-height:1.75}
.f-privacy input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:#06C167;cursor:pointer}
.f-privacy a{color:#06C167;text-decoration:underline}

/* ── SUBMIT ── */

/* モバイル：縦1列・横並びラベル */
.f-time-grid{display:grid;grid-template-columns:1fr;gap:8px}
.f-radio-label{display:flex;flex-direction:row;align-items:center;gap:8px;cursor:pointer;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:10px;transition:border-color .2s,background .2s;background:#fafafa}
.f-radio-label:hover{border-color:#06C167;background:#f0faf5}
.f-radio-label input[type=checkbox]{width:16px;height:16px;accent-color:#06C167;flex-shrink:0;cursor:pointer}
.f-time-main{font-size:14px;font-weight:700;color:#222;white-space:nowrap}
.f-time-sep{color:#ccc;font-size:13px}
.f-time-time{font-size:13px;color:#555;white-space:nowrap}
.f-radio-label:has(input:checked){border-color:#06C167;background:#f0faf5}
.f-radio-label:has(input:checked) .f-time-main,
.f-radio-label:has(input:checked) .f-time-time{color:#222}
@media(max-width:768px){
  .f-time-grid{grid-template-columns:1fr}
}

.f-submit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#06C167;color:#fff;border:none;border-radius:50px;padding:18px 28px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s;letter-spacing:.04em}
.f-submit:disabled{background:#ccc;cursor:not-allowed}
.f-submit:not(:disabled):hover{background:#04a857}
.f-submit-arrow{display:flex;align-items:center;flex-shrink:0}

.reassurance-title{text-align:center;font-size:16px;font-weight:700;color:#111;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.reassurance-deco{color:#06C167;font-size:1.1em}
.reassurance-card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:20px 12px;display:flex;align-items:stretch}
.reassurance-card-left{border-right:1px solid #f0f0f0;padding-right:12px;margin-right:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reassurance-icon{width:36px;height:36px;background:#e8faf2;border-radius:50%;display:flex;align-items:center;justify-content:center}
.reassurance-icon svg{width:18px;height:18px}
.reassurance-label{font-size:12px;font-weight:700;color:#111;display:block;margin-bottom:2px;word-break:break-all;overflow-wrap:break-word}
.reassurance-sub{font-size:11px;color:#888;line-height:1.5;display:block;word-break:break-all;overflow-wrap:break-word}
.footer{background:#1a1a1a;color:#fff;text-align:center;padding:20px 16px;font-size:12px;opacity:.9}

/* ── DELIVERY ANIMATION ── */
.dlv-overlay{
  position:fixed;inset:0;z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:rgba(6,193,103,.97);
  opacity:0;visibility:hidden;
  transition:opacity .3s ease,visibility .3s;
}
.dlv-overlay.dlv-on{opacity:1;visibility:visible}
.dlv-label{
  color:#fff;font-size:clamp(18px,4vw,24px);font-weight:700;letter-spacing:.06em
}
.dlv-dots{display:flex;gap:8px}
.dlv-dot{
  width:9px;height:9px;background:rgba(255,255,255,.5);
  border-radius:50%;
  animation:dlvPulse 1.2s ease-in-out infinite;
}
.dlv-dot:nth-child(2){animation-delay:.2s}
.dlv-dot:nth-child(3){animation-delay:.4s}
@keyframes dlvPulse{
  0%,80%,100%{transform:scale(1);opacity:.4}
  40%{transform:scale(1.5);opacity:1;background:#fff}
}
.dlv-road-wrap{position:relative;width:100%;height:60px;overflow:hidden}
.dlv-road{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.5) 0, rgba(255,255,255,.5) 28px,
    transparent 28px, transparent 48px);
}
.dlv-bike-track{
  position:absolute;top:50%;left:-110px;
  transform:translateY(-100%);
}
.dlv-overlay.dlv-on .dlv-bike-track{
  animation:dlvBikeRide 2s cubic-bezier(.3,.05,.7,.95) forwards;
}
.dlv-bike-icon{
  width:80px;height:80px;display:block;
}
.dlv-overlay.dlv-on .dlv-bike-icon{
  animation:dlvBikeWobble .22s ease infinite alternate;
}
@keyframes dlvBikeRide{
  from{transform:translateX(0) translateY(-100%)}
  to{transform:translateX(calc(100vw + 220px)) translateY(-100%)}
}
@keyframes dlvBikeWobble{
  from{transform:translateY(0)}
  to{transform:translateY(-7px)}
}

/* ===== Cookie同意バナー ===== */
.cookie-banner{
  position:fixed;bottom:0;left:0;right:0;z-index:99990;
  background:rgba(20,20,20,.96);backdrop-filter:blur(6px);
  color:#fff;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  transform:translateY(100%);transition:transform .4s ease;
}
.cookie-banner.cookie-show{transform:translateY(0)}
.cookie-banner-text{
  font-size:12px;line-height:1.7;color:rgba(255,255,255,.85);flex:1;min-width:200px;
}
.cookie-banner-text a{color:#06C167;text-decoration:underline}
.cookie-banner-btn{
  background:#06C167;color:#fff;border:none;border-radius:6px;
  padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;
  white-space:nowrap;flex-shrink:0;
  transition:background .2s;
}
.cookie-banner-btn:hover{background:#04a857}
</style>
<script>if(location.search.indexOf('embed=1')!==-1)document.documentElement.classList.add('embed-mode');</script>
</head>
<body>

<!-- HEADER -->
<header class="hd" id="top">
  <div class="hd-inner">
    <div class="hd-logo">
      <a href="index-lp.html" style="display:flex;align-items:center;line-height:0">
        <img src="https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1024x1024_v-fs_webp_47882e92-4939-4748-81c3-57aeb5a1d5b3.png" alt="FlagK Co., Ltd.">
      </a>
    </div>
    <div class="hd-divider"></div>
    <div class="hd-brand">
      <p class="hd-brand-main"><span class="hd-brand-ue">Uber Eats</span> <span class="hd-brand-small">出店登録サポート</span></p>
    </div>
    <div class="hd-spacer"></div>
  </div>
</header>

<!-- HERO -->
<div class="hero-wrap">
  <img class="hero-img" src="https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1821x864_v-frms_webp_58b220e7-0bba-40de-a086-9712cb8a0a6a.png" alt="Uber Eats最新キャンペーンを無料でご案内">
</div>

<!-- FORM SECTION TITLE -->
<div class="form-section-wrap">
  <p class="form-section-title">
    <span class="form-title-deco"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 10h16c0-4.4-3.6-7-8-7S4 5.6 4 10z"/><path d="M4 10h16v1.5c0 .8-.7 1.5-1.5 1.5h-13C4.7 13 4 12.3 4 11.5V10z"/><rect x="3" y="13" width="18" height="2" rx="1"/><path d="M4 15h16c0 2.2-3.6 4-8 4s-8-1.8-8-4z"/></svg></span>
    キャンペーン確認フォーム
    <span class="form-title-deco"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><circle cx="5.5" cy="17.5" r="3"/><circle cx="18.5" cy="17.5" r="3"/><path d="M15 6a1 1 0 100-2 1 1 0 000 2z" fill="#06C167" stroke="none"/><path d="M12 17.5L9 10.5l3-3h4l2.5 3.5"/><path d="M5.5 17.5L9 10.5"/></svg></span>
  </p>
  <p class="form-section-sub">30秒で入力完了！</p>
</div>

<!-- FORM -->
<div class="form-wrap">
  <div class="panel">

    <!-- ★ action を送信先URLに変更してください -->
    <form id="cf-form" action="#" method="post">

      <!-- 会社名・店舗名 -->
      <div class="f-row">
        <label class="f-lbl" for="company">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          会社名（店舗名）<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="text" id="company" name="company" placeholder="例）株式会社FlagK" required>
      </div>

      <!-- ご担当者名 -->
      <div class="f-row">
        <label class="f-lbl" for="contact_name">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          ご担当者名<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="text" id="contact_name" name="contact_name" placeholder="例）山田 太郎" required>
      </div>

      <!-- ご連絡先 -->
      <div class="f-row">
        <label class="f-lbl" for="tel">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.68A2 2 0 012 .18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/></svg></span>
          ご連絡先<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="tel" id="tel" name="tel" placeholder="例）03-1234-5678" required>
      </div>

      <!-- メールアドレス -->
      <div class="f-row">
        <label class="f-lbl" for="email">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
          メールアドレス<span class="f-opt">任意</span>
        </label>
        <input class="f-input" type="email" id="email" name="email" placeholder="例）example@flagk.com">
      </div>

      <!-- 連絡希望時間 -->
      <div class="f-row">
        <div class="f-lbl">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
          連絡希望時間<span class="f-req">必須</span>
        </div>
        <div class="f-time-grid">
          <label class="f-radio-label">
              <input type="checkbox" name="contact_time" value="10:00〜12:00">
              <span class="f-time-main">午前</span>
              <span class="f-time-sep">｜</span>
              <span class="f-time-time">10:00〜12:00</span>
          </label>
          <label class="f-radio-label">
              <input type="checkbox" name="contact_time" value="13:00〜15:00">
              <span class="f-time-main">午後</span>
              <span class="f-time-sep">｜</span>
              <span class="f-time-time">13:00〜15:00</span>
          </label>
          <label class="f-radio-label">
              <input type="checkbox" name="contact_time" value="15:00〜18:00">
              <span class="f-time-main">夕方</span>
              <span class="f-time-sep">｜</span>
              <span class="f-time-time">15:00〜18:00</span>
          </label>
        </div>
      </div>

      <!-- お問合せ内容 -->
      <div class="f-row">
        <label class="f-lbl" for="inquiry_type">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
          お問合せ内容<span class="f-req">必須</span>
        </label>
        <div class="f-sel-wrap">
          <select class="f-select" id="inquiry_type" name="inquiry_type" required>
            <option value="">選択してください</option>
            <option value="適用キャンペーンについて">適用キャンペーンについて</option>
            <option value="キャンペーン条件の確認">キャンペーン条件の確認</option>
            <option value="出店登録のご相談">出店登録のご相談</option>
            <option value="その他">その他</option>
          </select>
        </div>
      </div>

      <!-- フリーテキスト -->
      <div class="f-row">
        <textarea class="f-textarea" name="message" placeholder="お問い合わせ内容はこちらにご記載ください（任意）"></textarea>
      </div>

      <!-- プライバシーポリシー -->
      <div class="f-privacy">
        <input type="checkbox" id="privacy" required>
        <label for="privacy">
          <a href="https://jxx98.github.io/flagk-lp/privacy-policy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意のうえ送信してください。
        </label>
      </div>

      <!-- 送信ボタン -->
      <div class="f-submit-wrap">
        <button type="submit" class="f-submit" id="submit-btn" disabled>
          <span id="btn-text">未入力の項目があります</span>
          <span class="f-submit-arrow" id="btn-arrow"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0"><circle cx="5.5" cy="17.5" r="3"/><circle cx="18.5" cy="17.5" r="3"/><path d="M15 6a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" stroke="none"/><path d="M12 17.5L9 10.5l3-3h4l2.5 3.5"/><path d="M5.5 17.5L9 10.5"/></svg></span>
        </button>
      </div>

    </form>
  </div>

<script>
/* ===== 自転車送信アニメーション ===== */
(function(){
  var ov = document.getElementById('dlv-overlay');
  if(!ov) return;

  function showBike(cb){
    /* アニメーションリセット */
    var track = ov.querySelector('.dlv-bike-track');
    var icon  = ov.querySelector('.dlv-bike-icon');
    [track, icon].forEach(function(el){
      el.style.animation = 'none';
      el.offsetHeight; /* reflow */
      el.style.animation = '';
    });
    ov.setAttribute('aria-hidden','false');
    ov.classList.add('dlv-on');
    setTimeout(function(){
      ov.classList.remove('dlv-on');
      ov.setAttribute('aria-hidden','true');
      setTimeout(cb, 300);
    }, 2400);
  }

  var pending = false;
  document.querySelectorAll('form').forEach(function(form){
    form.addEventListener('submit', function(e){
      if(pending) return;
      if(!form.checkValidity()) return;
      e.preventDefault();
      pending = true;
      showBike(function(){
        pending = false;
        form.submit();
      });
    }, true);
  });
})();
</script>

  if(localStorage.getItem(KEY)) return; /* 既に同意済み */
  var banner = document.getElementById('cookie-banner');
