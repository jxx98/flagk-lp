<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャンペーン確認フォーム | FlagK Co., Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{width:100%;margin:0;padding:0;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f5f7f6;color:#333}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}

/* ── HEADER ── */
.hd{background:#fff;border-bottom:3px solid #06C167;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hd-logo img{height:44px;width:auto;flex-shrink:0}
.hd-btns{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hd-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:5px;background:#fff;color:#111;border:1.5px solid #06C167;font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none;letter-spacing:.04em;transition:all .2s}
.hd-btn:hover{background:#f0fff8}
.hd-btn-icon{height:26px;width:auto;flex-shrink:0;display:block}
.hd-line-icon{width:22px;height:22px;flex-shrink:0;object-fit:contain}
.back-bar{background:#f8f8f8;border-bottom:1px solid #e8e8e8;padding:7px 20px;text-align:right}
.back-bar a{color:#06C167;text-decoration:none;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.back-bar a:hover{text-decoration:underline}
@media(max-width:480px){
  .hd{padding:0 14px}
  .hd-btn{font-size:11px;padding:6px 9px;gap:4px}
  .hd-btn-icon{height:22px}
  .hd-line-icon{width:19px;height:19px}
  .back-bar{padding:7px 14px}
}

/* ── HERO ── */
.hero{
  width:100%;
  margin:0;
  background:url('https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1774x887_v-fms_webp_0d87d188-c8c0-4ede-8743-b6f168654307.png') right top / cover no-repeat #028844;
  height:clamp(280px,26vw,420px);
  padding:32px 40px;
  color:#fff;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
}
.hero-eyebrow{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;margin-bottom:10px;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.hero-eyebrow-icon{font-size:20px;line-height:1;flex-shrink:0}
.hero-title{font-size:clamp(24px,3.8vw,42px);font-weight:900;line-height:1.3;margin-bottom:16px;letter-spacing:.02em;text-align:left;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.hero-hours{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);border-radius:24px;padding:8px 20px;font-size:13px;font-weight:700;color:#fff}
.hero-hours-dot{width:8px;height:8px;background:#FFD600;border-radius:50%;flex-shrink:0}
/* ── HERO モバイル ── */
@media(max-width:600px){
  .hero{height:210px;padding:20px 20px;background-position:right top;justify-content:center;margin:0}
  .hero-eyebrow{font-size:11px;margin-bottom:6px;gap:4px}
  .hero-eyebrow-icon{font-size:14px}
  .hero-title{font-size:16px;margin-bottom:12px;line-height:1.3}
  .hero-hours{font-size:11px;padding:6px 14px}
}


/* ── EMBED MODE (iframe内表示時) ── */
.embed-mode .hd,.embed-mode .back-bar{display:none!important}
.embed-mode .hero{border-radius:0}
</style>
<script>if(location.search.indexOf('embed=1')!==-1)document.documentElement.classList.add('embed-mode');</script>
