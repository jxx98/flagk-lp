<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャンペーン確認フォーム | FlagK Co., Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{width:100%;margin:0;padding:0;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f5f7f6;color:#333}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}

/* ── HEADER ── */
.hd{background:#fff;border-bottom:3px solid #06C167;padding:0 24px;height:68px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hd-logo img{height:44px;width:auto;display:block}
@media(max-width:600px){.hd{padding:0 16px;height:56px}.hd-logo img{height:36px}}

/* ── HERO ── */
.hero-img{width:100%;display:block;margin:0}
@media(min-width:601px){
  .hero-img{width:auto;max-height:580px;max-width:100%;margin:0 auto}
}

/* ── FORM SECTION TITLE ── */
.form-section-wrap{text-align:center;padding:28px 16px 4px}
.form-section-title{font-size:clamp(18px,3vw,22px);font-weight:700;color:#111;display:inline-flex;align-items:center;gap:10px;letter-spacing:.02em}
.form-title-hl{color:#06C167}
.form-title-deco{color:#06C167;font-size:1em;flex-shrink:0}
.form-section-sub{text-align:center;font-size:14px;color:#06C167;font-weight:700;margin-top:4px;margin-bottom:0}

/* ── FORM PANEL ── */
.form-wrap{max-width:600px;margin:0 auto;padding:16px 16px 56px}
.panel{background:#fff;border-radius:16px;box-shadow:0 4px 28px rgba(0,0,0,.10);padding:32px 32px 36px}
@media(max-width:480px){.panel{padding:24px 16px 28px}}

/* ── FORM ROWS ── */
.f-row{margin-bottom:22px}
.f-lbl{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;font-weight:700;color:#222}
.f-lbl-icon{width:32px;height:32px;border-radius:50%;background:#e8faf2;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.f-lbl-icon svg{width:17px;height:17px}
.f-req{display:inline-block;font-size:10px;font-weight:700;background:#e53935;color:#fff;padding:2px 7px;border-radius:3px;flex-shrink:0}
.f-opt{display:inline-block;font-size:10px;font-weight:700;background:#aaa;color:#fff;padding:2px 7px;border-radius:3px;flex-shrink:0}
.f-input,.f-select,.f-textarea{width:100%;border:1.5px solid #e0e0e0;border-radius:8px;padding:13px 14px;font-size:15px;font-family:inherit;color:#111;background:#fafafa;transition:border-color .2s,background .2s;outline:none}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:#06C167;background:#fff;box-shadow:0 0 0 3px rgba(6,193,103,.12)}
.f-input::placeholder,.f-textarea::placeholder{color:#ccc}
.f-textarea{min-height:80px;resize:vertical;line-height:1.6}
.f-sel-wrap{position:relative}
.f-sel-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#888;pointer-events:none;font-size:13px}
.f-select{padding-right:36px;cursor:pointer;appearance:none;-webkit-appearance:none}

/* ── PRIVACY ── */
.f-privacy{display:flex;align-items:flex-start;gap:8px;margin:24px 0 22px;font-size:13px;color:#555;line-height:1.75}
.f-privacy input[type=checkbox]{width:16px;height:16px;flex-shrink:0;margin-top:3px;accent-color:#06C167;cursor:pointer}
.f-privacy a{color:#06C167;text-decoration:underline}

/* ── SUBMIT ── */
.f-submit-wrap{display:flex;justify-content:center}
.f-submit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#06C167;color:#fff;border:none;border-radius:50px;padding:18px 28px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s;letter-spacing:.04em}
.f-submit:hover:not(:disabled){background:#04a857}
.f-submit:disabled{background:#b0e0ca;cursor:not-allowed}
.f-submit-arrow{font-size:18px;font-weight:400;flex-shrink:0}


/* ── REASSURANCE ── */
.reassurance-outer{max-width:600px;margin:0 auto;padding:0 16px 48px}
.reassurance-title{text-align:center;font-size:16px;font-weight:700;color:#111;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.reassurance-deco{color:#06C167;font-size:1.1em}
.reassurance-card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:20px 12px;display:flex;align-items:stretch}
.reassurance-item{flex:1;min-width:0;display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:start;padding:4px 8px}
.reassurance-item+.reassurance-item{border-left:1px solid #ebebeb}
.reassurance-icon{width:36px;height:36px;border-radius:50%;background:#e8faf2;display:flex;align-items:center;justify-content:center}
.reassurance-icon svg{width:18px;height:18px}
.reassurance-text{min-width:0;overflow:hidden}
.reassurance-label{font-size:12px;font-weight:700;color:#111;display:block;margin-bottom:2px;word-break:break-all;overflow-wrap:break-word}
.reassurance-sub{font-size:11px;color:#888;line-height:1.5;display:block;word-break:break-all;overflow-wrap:break-word}
@media(max-width:480px){
  .reassurance-card{flex-direction:column;gap:16px;padding:20px 16px}
  .reassurance-item{width:100%;padding:0}
  .reassurance-item+.reassurance-item{border-left:none;border-top:1px solid #f0f0f0;padding-top:16px}
}

/* ── FOOTER ── */
.footer{background:#1a1a1a;color:#fff;text-align:center;padding:20px 16px;font-size:12px;opacity:.9}

/* ── EMBED MODE (iframe内表示時) ── */
.embed-mode .hd{display:none!important}
</style>
<script>if(location.search.indexOf('embed=1')!==-1)document.documentElement.classList.add('embed-mode');</script>
</head>

<!-- HERO -->
<img class="hero-img" src="https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1672x941_v-fms_webp_27c2279a-7140-4120-a18c-4563e3b87136.png" alt="Uber Eats最新キャンペーンを無料でご案内">

<!-- FORM SECTION TITLE -->
<div class="form-section-wrap">
  <p class="form-section-title">
    <span class="form-title-deco">⇒</span>
    キャンペーン確認フォーム
    <span class="form-title-deco">⇐</span>

<!-- FORM -->
<div class="form-wrap">
  <div class="panel">

    <!-- ★ action を送信先URLに変更してください -->
    <form id="cf-form" action="#" method="post">

      <!-- 会社名・店舗名 -->
      <div class="f-row">
        <label class="f-lbl" for="company">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          会社名（店舗名）<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="text" id="company" name="company" placeholder="例）株式会社FlagK" required>
      </div>

      <!-- ご担当者名 -->
      <div class="f-row">
        <label class="f-lbl" for="contact_name">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          ご担当者名<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="text" id="contact_name" name="contact_name" placeholder="例）山田 太郎" required>
      </div>

      <!-- ご連絡先 -->
      <div class="f-row">
        <label class="f-lbl" for="tel">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.68A2 2 0 012 .18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/></svg></span>
          ご連絡先<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="tel" id="tel" name="tel" placeholder="例）03-1234-5678" required>
      </div>

      <!-- メールアドレス -->
      <div class="f-row">
        <label class="f-lbl" for="email">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
          メールアドレス<span class="f-opt">任意</span>
        </label>
        <input class="f-input" type="email" id="email" name="email" placeholder="例）example@flagk.com">
      </div>

      <!-- お問合せ内容 -->
      <div class="f-row">
        <label class="f-lbl" for="inquiry_type">
          <span class="f-lbl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#06C167" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
          お問合せ内容<span class="f-req">必須</span>
        </label>
        <div class="f-sel-wrap">
          <select class="f-select" id="inquiry_type" name="inquiry_type" required>
            <option value="">選択してください</option>
            <option value="適用キャンペーンについて">適用キャンペーンについて</option>
            <option value="キャンペーン条件の確認">キャンペーン条件の確認</option>
            <option value="出店登録のご相談">出店登録のご相談</option>
            <option value="その他">その他</option>
          </select>
        </div>
      </div>

      <!-- フリーテキスト -->
      <div class="f-row">
        <textarea class="f-textarea" name="message" placeholder="お問い合わせ内容はこちらにご記載ください（任意）"></textarea>
      </div>

      <!-- プライバシーポリシー -->
      <div class="f-privacy">
        <input type="checkbox" id="privacy" required>
        <label for="privacy">
          <a href="https://jxx98.github.io/flagk-lp/privacy-policy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意のうえ送信してください。
        </label>
      </div>

      <!-- 送信ボタン -->
      <div class="f-submit-wrap">
        <button type="submit" class="f-submit" id="submit-btn" disabled>
          <span id="btn-text">入力内容を送信する</span>
          <span class="f-submit-arrow" id="btn-arrow"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0"><circle cx="5.5" cy="17.5" r="3"/><circle cx="18.5" cy="17.5" r="3"/><path d="M15 6a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" stroke="none"/><path d="M12 17.5L9 10.5l3-3h4l2.5 3.5"/><path d="M5.5 17.5L9 10.5"/></svg></span>
        </button>
      </div>

    </form>

        <span class="reassurance-label">所要時間は数分でOK</span>
        <span class="reassurance-sub">すぐにご案内いたします</span>
      </div>
    </div>
  </div>

<script>
// 親ページへ高さを通知（iframe自動リサイズ用）
(function(){
  function sendHeight(){
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({iframeHeight: h}, '*');
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true,attributes:true});
})();

// バリデーション
(function(){
  var form    = document.getElementById('cf-form');
  var btn     = document.getElementById('submit-btn');
  var btnText = document.getElementById('btn-text');
  var btnArr  = document.getElementById('btn-arrow');
  function check(){
    var ok = form.checkValidity();
    btn.disabled        = !ok;
    btnText.textContent = '入力内容を送信する';
      }
  form.addEventListener('input',  check);
  form.addEventListener('change', check);
  check();
})();
</script>
