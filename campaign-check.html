<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャンペーン確認フォーム | FlagK Co., Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{width:100%;margin:0;padding:0;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f5f7f6;color:#333}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}

/* ── HEADER ── */
.hd{background:#fff;border-bottom:3px solid #06C167;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hd-left{display:flex;align-items:center;gap:14px;min-width:0}
.hd-logo img{height:44px;width:auto;flex-shrink:0}
.hd-divider{width:1px;height:34px;background:#ddd;flex-shrink:0}
.hd-brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hd-brand-text{font-size:15px;font-weight:700;color:#111;white-space:nowrap;letter-spacing:.02em}
.hd-btns{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hd-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none;letter-spacing:.02em;transition:all .2s;border:1.5px solid #06C167}
.hd-btn--tel{background:#fff;color:#111}
.hd-btn--tel:hover{background:#f0fff8}
.hd-btn--line{background:#06C167;color:#fff}
.hd-btn--line:hover{background:#04a857}
.hd-btn-icon{height:22px;width:auto;flex-shrink:0;display:block}
.hd-line-icon{width:20px;height:20px;flex-shrink:0;object-fit:contain}
@media(max-width:600px){
  .hd{padding:0 14px;height:56px}
  .hd-divider{display:none}
  .hd-brand-text{display:none}
  .hd-btn{font-size:11px;padding:7px 10px;gap:4px}
  .hd-btn-icon{height:18px}
  .hd-line-icon{width:17px;height:17px}
}

/* ── HERO ── */
.hero{
  width:100%;
  margin:0;
  background:url('https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1774x887_v-fms_webp_0d87d188-c8c0-4ede-8743-b6f168654307.png') right top / auto 87% no-repeat #028844;
  height:clamp(400px,36vw,500px);
  padding:44px 40px 44px 90px;
  color:#fff;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
}
/* アイブロウバッジ */
.hero-eyebrow-wrap{position:relative;display:inline-block;margin-bottom:16px;z-index:1}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:700;letter-spacing:.04em;color:#FFD600;border:none;border-radius:24px;padding:7px 16px;background:#fff;margin:0;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hero-eyebrow-icon{line-height:1;flex-shrink:0}
.hero-sparkle{position:absolute;top:-14px;right:-18px;pointer-events:none;display:block;width:22px;height:18px}
/* タイトル */
.hero-title{font-size:clamp(26px,3.8vw,46px);font-weight:900;line-height:1.25;margin-bottom:16px;letter-spacing:.02em;text-align:left;color:#fff;z-index:1;position:relative}
.hero-title-hl{color:#FFD600}
/* 仕切り線 */
.hero-divider{border:none;border-top:1px solid rgba(255,255,255,.35);margin:0 0 16px 0;width:clamp(200px,28vw,380px);z-index:1;position:relative}
/* サブコピー */
.hero-sub{font-size:clamp(13px,1.4vw,15px);font-weight:400;color:rgba(255,255,255,.9);margin-bottom:24px;line-height:1.8;z-index:1;position:relative}
/* 受付バッジ */
.hero-hours{display:inline-flex;align-items:center;gap:10px;background:#fff;border:none;border-radius:32px;padding:11px 28px;font-size:15px;font-weight:700;color:#028844;z-index:1;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hero-hours-icon{width:18px;height:18px;flex-shrink:0;display:block}
/* ── HERO モバイル ── */
@media(max-width:600px){
  .hero{height:auto;min-height:280px;padding:24px 20px 24px 24px;background-size:auto 80%;background-position:right top;justify-content:center;margin:0}
  .hero-eyebrow-wrap{margin-bottom:12px}
  .hero-eyebrow{font-size:12px;padding:5px 11px;gap:4px}
  .hero-sparkle{width:17px;height:14px;top:-11px;right:-14px}
  .hero-title{font-size:20px;margin-bottom:10px;line-height:1.3}
  .hero-divider{display:none}
  .hero-sub{font-size:12px;margin-bottom:14px}
  .hero-hours{font-size:12px;padding:7px 16px;gap:7px}
  .hero-hours-icon{width:15px;height:15px}
}


/* ── EMBED MODE (iframe内表示時) ── */
.embed-mode .hd{display:none!important}
.embed-mode .hero{border-radius:0}
</style>
<script>if(location.search.indexOf('embed=1')!==-1)document.documentElement.classList.add('embed-mode');</script>
</head>
