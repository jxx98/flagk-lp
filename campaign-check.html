<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャンペーン確認フォーム | FlagK Co., Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{width:100%;margin:0;padding:0;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f5f7f6;color:#333}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}

/* ── HEADER ── */
.hd{background:#fff;border-bottom:3px solid #06C167;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hd-logo img{height:26px;width:auto;flex-shrink:0}
.hd-btns{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hd-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:5px;background:#fff;color:#111;border:1.5px solid #06C167;font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none;letter-spacing:.04em;transition:all .2s}
.hd-btn:hover{background:#f0fff8}
.hd-btn-icon{height:26px;width:auto;flex-shrink:0;display:block}
.hd-line-icon{width:22px;height:22px;flex-shrink:0;object-fit:contain}
.back-bar{background:#f8f8f8;border-bottom:1px solid #e8e8e8;padding:7px 20px}
.back-bar a{color:#06C167;text-decoration:none;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.back-bar a:hover{text-decoration:underline}
@media(max-width:480px){
  .hd{padding:0 14px}
  .hd-btn{font-size:11px;padding:6px 9px;gap:4px}
  .hd-btn-icon{height:22px}
  .hd-line-icon{width:19px;height:19px}
  .back-bar{padding:7px 14px}
}

/* ── HERO ── */
.hero{
  width:100%;
  margin:0;
  background:url('https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1774x887_v-fms_webp_0d87d188-c8c0-4ede-8743-b6f168654307.png') right top / cover no-repeat #028844;
  height:clamp(280px,26vw,420px);
  padding:32px 40px;
  color:#fff;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
}
.hero-eyebrow{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;margin-bottom:10px;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.hero-eyebrow-icon{font-size:20px;line-height:1;flex-shrink:0}
.hero-title{font-size:clamp(24px,3.8vw,42px);font-weight:900;line-height:1.3;margin-bottom:16px;letter-spacing:.02em;text-align:left;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.hero-hours{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);border-radius:24px;padding:8px 20px;font-size:13px;font-weight:700;color:#fff}
.hero-hours-dot{width:8px;height:8px;background:#FFD600;border-radius:50%;flex-shrink:0}
/* ── HERO モバイル ── */
@media(max-width:600px){
  .hero{height:210px;padding:20px 20px;background-position:right top;justify-content:center;margin:0}
  .hero-eyebrow{font-size:11px;margin-bottom:6px;gap:4px}
  .hero-eyebrow-icon{font-size:14px}
  .hero-title{font-size:16px;margin-bottom:12px;line-height:1.3}
  .hero-hours{font-size:11px;padding:6px 14px}
}

/* ── FORM PANEL ── */
.form-wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
.panel{background:#fff;border-radius:14px;box-shadow:0 4px 28px rgba(0,0,0,.10);padding:32px 32px 36px}
@media(max-width:480px){.panel{padding:24px 18px 28px}}

.panel-note{font-size:13px;color:#555;line-height:1.85;margin-bottom:24px;padding:12px 14px;background:#f0faf5;border-left:3px solid #06C167;border-radius:0 6px 6px 0}

/* ── FORM ROWS ── */
.f-row{margin-bottom:20px}
.f-lbl{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:700;color:#222}
.f-req{display:inline-block;font-size:10px;font-weight:700;background:#06C167;color:#fff;padding:2px 6px;border-radius:3px;flex-shrink:0}
.f-opt{display:inline-block;font-size:10px;font-weight:700;background:#bbb;color:#fff;padding:2px 6px;border-radius:3px;flex-shrink:0}
.f-input{width:100%;border:1px solid #ddd;border-radius:7px;padding:13px 14px;font-size:15px;font-family:inherit;color:#111;background:#fafafa;transition:border-color .2s,background .2s;outline:none}
.f-input:focus{border-color:#06C167;background:#fff;box-shadow:0 0 0 3px rgba(6,193,103,.12)}
.f-input::placeholder{color:#bbb}
.f-sel-wrap{position:relative}
.f-sel-wrap::after{content:'▼';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;color:#888;pointer-events:none}
.f-select{width:100%;border:1px solid #ddd;border-radius:7px;padding:13px 14px;font-size:15px;font-family:inherit;color:#111;background:#fafafa;appearance:none;outline:none;cursor:pointer;transition:border-color .2s}
.f-select:focus{border-color:#06C167;background:#fff;box-shadow:0 0 0 3px rgba(6,193,103,.12)}
.f-textarea{width:100%;border:1px solid #ddd;border-radius:7px;padding:13px 14px;font-size:15px;font-family:inherit;color:#111;background:#fafafa;resize:vertical;min-height:120px;outline:none;transition:border-color .2s}
.f-textarea:focus{border-color:#06C167;background:#fff;box-shadow:0 0 0 3px rgba(6,193,103,.12)}
.f-textarea::placeholder{color:#bbb}

/* ── PRIVACY ── */
.f-privacy{display:flex;align-items:flex-start;gap:10px;margin:24px 0 28px;font-size:12px;color:#555;line-height:1.75}
.f-privacy input[type=checkbox]{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:#06C167;cursor:pointer}
.f-privacy a{color:#06C167;text-decoration:underline}

/* ── SUBMIT ── */
.f-submit-wrap{display:flex;justify-content:center}
.f-submit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:380px;background:#111;color:#fff;border:none;border-radius:10px;padding:18px 28px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .25s,border-radius .25s;letter-spacing:.04em}
.f-submit:hover:not(:disabled){background:#222}
.f-submit:disabled{background:#c5cacc;cursor:not-allowed;border-radius:50px}
.f-submit-arrow{font-size:20px;font-weight:400;flex-shrink:0}

/* ── SSL NOTICE ── */
.ssl-notice{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;font-size:11px;color:#888;line-height:1.6;text-align:center}
.ssl-icon{font-size:16px;flex-shrink:0}

/* ── FOOTER ── */
.footer{background:#1a1a1a;color:#fff;text-align:center;padding:20px 16px;font-size:12px;opacity:.9}
</style>
</head>
<body>

  </div>
  <div class="hd-btns">
    <a href="tel-reservation.html" class="hd-btn">
      <img src="https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1536x1024_v-fms_webp_f505f13c-f085-497c-b9fe-9397be5bfb88.png" alt="" class="hd-btn-icon"> 電話相談予約

    <a href="https://lin.ee/RhSAYu3" class="hd-btn" target="_blank" rel="noopener">

    </a>
  </div>
</header>
<div class="back-bar">
  <a href="index-lp.html"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> TOPへ</a>
</div>

<!-- HERO -->
<div class="hero">
  <p class="hero-eyebrow">
    <span class="hero-eyebrow-icon"><img src="https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1536x1024_v-fms_webp_e15ed3a7-0367-49da-9713-e19b2c024199.png" alt="" style="height:20px;width:auto;display:block"></span>
    今すぐ確認！
  </p>
  <h1 class="hero-title">
    Uber Eatsの最新キャンペーン、<br>
    あなたのお店は対象？
  </h1>
  <div class="hero-hours">
    <span class="hero-hours-dot"></span>
    受付時間：平日 9:30〜18:00
  </div>
</div>

<!-- FORM -->
<div class="form-wrap">
  <div class="panel">

    <p class="panel-note">※ お客様の店舗情報をもとに、適用可能なキャンペーンをご案内いたします。内容を確認後、担当者よりご連絡いたします。ご不在の場合は、改めてご連絡させていただきます。</p>

    <!-- ★ action を送信先URLに変更してください -->
    <form id="campaign-form" action="#" method="post">

      <!-- 会社名・店舗名・施設名 -->
      <div class="f-row">
        <label class="f-lbl" for="company">
          会社名・店舗名・施設名<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="text" id="company" name="company"
               placeholder="例）FlagK株式会社" required>
      </div>

      <!-- 担当者氏名 -->
      <div class="f-row">
        <label class="f-lbl" for="contact_name">
          担当者氏名<span class="f-opt">任意</span>
        </label>
        <input class="f-input" type="text" id="contact_name" name="contact_name"
               placeholder="例）田中 太郎">
      </div>

      <!-- 店舗番号 -->
      <div class="f-row">
        <label class="f-lbl" for="store_number">
          店舗番号<span class="f-opt">任意</span>
        </label>
        <input class="f-input" type="text" id="store_number" name="store_number"
               placeholder="例）03-1234-5678">
      </div>

      <!-- 連絡先 -->
      <div class="f-row">
        <label class="f-lbl" for="tel">
          連絡先<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="tel" id="tel" name="tel"
               placeholder="例）090-1234-5678" required>
      </div>

      <!-- メールアドレス -->
      <div class="f-row">
        <label class="f-lbl" for="email">
          メールアドレス<span class="f-req">必須</span>
        </label>
        <input class="f-input" type="email" id="email" name="email"
               placeholder="例）info@flagk-co.jp" required>
      </div>

      <!-- お問い合わせ種別 -->
      <div class="f-row">
        <label class="f-lbl" for="inquiry_type">
          お問い合わせ種別<span class="f-req">必須</span>
        </label>
        <div class="f-sel-wrap">
          <select class="f-select" id="inquiry_type" name="inquiry_type" required>
            <option value="">選択してください</option>
            <option>掲載希望</option>
            <option>掲載に関するご相談</option>
            <option>代理店・パートナー希望</option>
            <option>その他</option>
          </select>
        </div>
      </div>

      <!-- お問い合わせ内容 -->
      <div class="f-row">
        <label class="f-lbl" for="message">
          お問い合わせ内容<span class="f-opt">任意</span>
        </label>
        <textarea class="f-textarea" id="message" name="message"
                  placeholder="例）デリバリーサービスを始めたい..."></textarea>
      </div>

      <!-- プライバシーポリシー -->
      <div class="f-privacy">
        <input type="checkbox" id="privacy" required>
        <label for="privacy">
          <a href="https://jxx98.github.io/flagk-lp/privacy-policy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意のうえ送信してください。
        </label>
      </div>

      <!-- 送信ボタン -->
      <div class="f-submit-wrap">
        <button type="submit" class="f-submit" id="submit-btn">
          <span id="btn-text">未入力の項目があります</span>
          <span class="f-submit-arrow" id="btn-arrow">›</span>
        </button>
      </div>

    </form>

    <!-- SSL -->
    <div class="ssl-notice">
      <span class="ssl-icon">🔒</span>
      <span>当フォームはSSLに対応しています。<br>お客様の情報は暗号化して送信されます。</span>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 FlagK Co., Ltd.</p>
</footer>

<script>
// 親ページへ高さを通知（iframe自動リサイズ用）
(function(){
  function sendHeight(){
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({iframeHeight: h}, '*');
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true,attributes:true});
})();

// バリデーション：未入力時はボタンにメッセージ表示
(function(){
  var form    = document.getElementById('campaign-form');
  var btn     = document.getElementById('submit-btn');
  var btnText = document.getElementById('btn-text');
  var btnArr  = document.getElementById('btn-arrow');
  function check(){
    var ok = form.checkValidity();
    btn.disabled        = !ok;
    btnText.textContent = ok ? '送信する' : '未入力の項目があります';
    btnArr.textContent  = ok ? '→'       : '›';
  }
  form.addEventListener('input',  check);
  form.addEventListener('change', check);
  check();
})();
</script>

</body>
