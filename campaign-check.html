<title>キャンペーン確認フォーム | FlagK Co., Ltd.</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{width:100%;margin:0;padding:0;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f5f7f6;color:#333}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}

/* ── HEADER ── */
.hd{background:#fff;border-bottom:3px solid #06C167;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hd-left{display:flex;align-items:center;gap:14px;min-width:0}
.hd-logo img{height:44px;width:auto;flex-shrink:0}
.hd-divider{width:1px;height:34px;background:#ddd;flex-shrink:0}
.hd-brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hd-brand-text{font-size:15px;font-weight:700;color:#111;white-space:nowrap;letter-spacing:.02em}
.hd-btns{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hd-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none;letter-spacing:.02em;transition:all .2s;border:1.5px solid #06C167}
.hd-btn--tel{background:#fff;color:#111}
.hd-btn--tel:hover{background:#f0fff8}
.hd-btn--line{background:#06C167;color:#fff}
.hd-btn--line:hover{background:#04a857}
.hd-btn-icon{height:22px;width:auto;flex-shrink:0;display:block}
.hd-line-icon{width:20px;height:20px;flex-shrink:0;object-fit:contain}
@media(max-width:600px){
  .hd{padding:0 14px;height:56px}
  .hd-divider{display:none}
  .hd-brand-text{display:none}
  .hd-btn{font-size:11px;padding:7px 10px;gap:4px}
  .hd-btn-icon{height:18px}
  .hd-line-icon{width:17px;height:17px}
}

/* ── HERO ── */
.hero-img{width:100%;display:block;margin:0}
@media(min-width:601px){
  .hero-img{width:auto;max-height:580px;max-width:100%;margin:0 auto}
}

/* ── EMBED MODE (iframe内表示時) ── */
.embed-mode .hd{display:none!important}
</style>
<script>if(location.search.indexOf('embed=1')!==-1)document.documentElement.classList.add('embed-mode');</script>
