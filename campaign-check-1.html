<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;color:#222;background:#f0f7f3}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button,input,textarea,select{font-family:inherit}

/* ── PAGE BACKGROUND ── */
.page-bg{
  position:fixed;inset:0;z-index:0;
  background:url('https://storage.googleapis.com/studio-design-asset-files/projects/v7qG76kJqL/s-1055x1491_v-fms_webp_6af000ed-abff-4561-86da-e3a601546308.png') center top/cover no-repeat;
  pointer-events:none;
}

/* ── HEADER ── */
.hd{
  position:fixed;top:0;left:0;right:0;
  height:60px;background:#fff;
  border-bottom:3px solid #F5A623;
  z-index:1000;
}
.hd-inner{
  display:flex;align-items:center;gap:10px;
  height:100%;padding:0 20px;
  max-width:1200px;margin:0 auto;
}
.hd-logo img{height:38px;width:auto}
.hd-divider{width:1px;height:36px;background:#e0e0e0;flex-shrink:0;margin:0 6px}
.hd-brand{font-size:15px;font-weight:700;color:#111;white-space:nowrap}
.hd-spacer{flex:1}
.hd-hours{
  display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:700;color:#333;
  white-space:nowrap;
}
.hd-hours svg{display:block;flex-shrink:0}

/* ── HERO ── */
.hero{
  position:relative;z-index:1;
  margin-top:60px;
}
.hero-inner{
  display:flex;
  align-items:flex-start;
  max-width:1160px;margin:0 auto;
  padding:40px 48px 0;
  min-height:460px;
}
.hero-left{
  flex:1;min-width:0;
}
.hero-right{
  flex:0 0 520px;
  align-self:flex-end;
  position:relative;
  min-height:420px;
}
.hero-person{
  position:absolute;
  bottom:-150px;
  left:0;right:0;
  width:100%;
  height:auto;
  display:block;
}

/* タグバッジ */
.hero-tag{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.92);
  border:1.5px solid #F5A623;
  border-radius:24px;padding:8px 18px;
  font-size:13px;font-weight:700;color:#333;
  margin-bottom:22px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

/* タイトル */
.hero-title{
  font-size:clamp(24px,2.8vw,38px);
  font-weight:700;color:#111;
  line-height:1.35;
  margin-bottom:36px;
  letter-spacing:.01em;
}
.hero-title-green{
  color:#D4900A;
  display:inline;
}

/* 特徴バッジ */
.hero-features{
  display:flex;gap:10px;
  margin-top:24px;
}
.hero-feature{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.88);
  border-radius:12px;
  padding:11px 13px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  flex:1;
}
.hero-feature-icon{
  width:36px;height:36px;
  border:1.5px solid #ddd;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hero-feature-icon svg{width:17px;height:17px}
.hero-feature-text{display:flex;flex-direction:column;gap:1px}
.hero-feature-main{font-size:11px;font-weight:700;color:#D4900A;white-space:nowrap}
.hero-feature-sub{font-size:12px;font-weight:700;color:#111;white-space:nowrap}

/* 本文 */
.hero-body{
  font-size:15px;color:#444;
  line-height:1.9;
  margin-bottom:22px;
}

/* ── FORM SECTION ── */
.form-section{
  position:relative;z-index:1;
  padding:0 20px 72px;
}
.form-card{
  background:#fff;
  border-radius:20px;
  box-shadow:0 8px 40px rgba(0,0,0,.13);
  max-width:560px;
  margin:0 auto;
  padding:32px 36px 44px;
}

/* ── FORM INNER ── */
.form-title{
  text-align:center;
  font-size:20px;font-weight:700;color:#111;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:6px;
}
.form-sub{
  text-align:center;font-size:14px;color:#D4900A;font-weight:700;
  margin-bottom:20px;
}
.form-rule{width:100%;height:1px;background:rgba(245,166,35,.25);border:none;margin-bottom:24px}

.f-row{margin-bottom:18px}
.f-lbl{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:700;color:#222}
.f-lbl-icon{width:28px;height:28px;border-radius:50%;background:#fff3d6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.f-lbl-icon svg{width:15px;height:15px}
.f-req{display:inline-block;font-size:10px;font-weight:700;background:#F5A623;color:#fff;padding:2px 7px;border-radius:3px;flex-shrink:0}
.f-opt{display:inline-block;font-size:10px;font-weight:700;background:#aaa;color:#fff;padding:2px 7px;border-radius:3px;flex-shrink:0}
.f-input{
  width:100%;border:1.5px solid #e0e0e0;border-radius:10px;
  padding:12px 14px;font-size:14px;color:#111;background:#fafafa;
  outline:none;transition:border-color .2s,background .2s;
}
.f-input:focus{border-color:#D4900A;background:#fff;box-shadow:0 0 0 3px rgba(245,166,35,.12)}
.f-input::placeholder{color:#ccc}

.f-sel-wrap{position:relative}
.f-sel-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#888;pointer-events:none;font-size:13px}
.f-select{
  width:100%;border:1.5px solid #e0e0e0;border-radius:10px;
  padding:12px 36px 12px 14px;font-size:14px;color:#111;background:#fafafa;
  outline:none;transition:border-color .2s,background .2s;
  cursor:pointer;appearance:none;-webkit-appearance:none;
}
.f-select:focus{border-color:#D4900A;background:#fff;box-shadow:0 0 0 3px rgba(245,166,35,.12)}

.f-textarea{
  width:100%;border:1.5px solid #e0e0e0;border-radius:10px;
  padding:12px 14px;font-size:14px;color:#111;background:#fafafa;
  outline:none;transition:border-color .2s,background .2s;
  min-height:80px;resize:vertical;line-height:1.6;
}
.f-textarea:focus{border-color:#D4900A;background:#fff;box-shadow:0 0 0 3px rgba(245,166,35,.12)}
.f-textarea::placeholder{color:#ccc}

.f-time-grid{display:flex;flex-direction:column;gap:8px}
.f-time-label{
  display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:11px 14px;border:1.5px solid #e0e0e0;border-radius:10px;
  background:#fafafa;transition:border-color .2s,background .2s;
}
.f-time-label:hover{border-color:#D4900A;background:#fff8ed}
.f-time-label input[type=checkbox]{width:16px;height:16px;accent-color:#D4900A;flex-shrink:0;cursor:pointer}
.f-time-label:has(input:checked){border-color:#D4900A;background:#fff8ed}
.f-time-name{font-size:13px;font-weight:700;color:#222}
.f-time-sep{color:#ccc;font-size:12px;margin:0 2px}
.f-time-range{font-size:12px;color:#555}

.f-privacy{display:flex;align-items:center;gap:8px;margin:20px 0 18px;font-size:12px;color:#555;line-height:1.75}
.f-privacy input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:#D4900A;cursor:pointer}
.f-privacy a{color:#D4900A;text-decoration:underline}

.f-submit{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;background:#F5A623;color:#fff;border:none;border-radius:50px;
  padding:16px 24px;font-size:16px;font-weight:700;
  cursor:pointer;transition:background .2s;letter-spacing:.04em;
}
.f-submit:disabled{background:#ccc;cursor:not-allowed}
.f-submit:not(:disabled):hover{background:#e09920}

/* ── モバイル ── */
@media(max-width:899px){
  .hero-inner{
    flex-direction:column;
    align-items:stretch;
    padding:32px 20px 0;
    min-height:auto;

  }
  .form-card{
    max-width:100%;
    margin:0;
    border-radius:0 0 20px 20px;
  }
  .form-section{padding:0 16px 48px}
}

/* ── FOOTER ── */
.footer{
  position:relative;z-index:1;
  background:#1a1a1a;color:#fff;
  text-align:center;padding:20px;font-size:12px;
}
</style>

  var btnText = document.getElementById('btn-text');
  function check(){
    var timeChecked = form.querySelectorAll('input[name="contact_time"]:checked').length > 0;
    var ok = form.checkValidity() && timeChecked;
    btn.disabled        = !ok;
    btnText.textContent = ok ? 'キャンペーン確認を申し込む' : '未入力の項目があります';
  }
  form.addEventListener('input',  check);
  form.addEventListener('change', check);
  check();
})();
</script>
