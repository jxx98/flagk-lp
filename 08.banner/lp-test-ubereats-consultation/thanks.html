<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>お問い合わせ完了 | Uber Eats 新規出店相談窓口</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="overrides.css">
  <style>
    .thanks-main {
      display: grid;
      min-height: calc(100vh - 82px);
      padding: 64px 24px;
      background: linear-gradient(135deg, #effaf3, #fffaf0);
      place-items: center;
    }
    .thanks-card {
      width: min(680px, 100%);
      padding: 58px 48px;
      text-align: center;
      background: #fff;
      border: 1px solid #dce6df;
      border-radius: 8px;
      box-shadow: 0 16px 45px rgba(28, 69, 44, .1);
    }
    .thanks-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 25px;
      color: #fff;
      background: #06c167;
      border-radius: 50%;
      font-size: 29px;
      font-weight: 800;
      place-items: center;
    }
    .thanks-card h1 { margin: 0; font-size: 25px; line-height: 1.6; }
    .thanks-card p { margin: 18px 0 0; color: #59665e; font-size: 15px; line-height: 2; }
    .thanks-card .thanks-tel { margin-top: 16px; }
    .thanks-card .thanks-tel a { color: #048c4c; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
    .thanks-card .button { min-width: 250px; margin-top: 32px; border: 0; }
    @media (max-width: 860px) {
      .thanks-main { min-height: calc(100vh - 70px); padding: 36px 16px; }
      .thanks-card { padding: 42px 24px; }
      .thanks-card h1 { font-size: 21px; }
      .thanks-card p { font-size: 14px; text-align: left; }
    }
  </style>
</head>
<body class="form-page thanks-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Uber Eats 新規出店相談窓口の先頭へ">
        <img src="images/flagk-logo.webp" width="61" height="61" alt="FlagK">
        <span><b>Uber Eats</b> 新規出店相談窓口</span>
      </a>
    </div>
  </header>
  <main class="thanks-main">
    <article class="thanks-card">
      <div class="thanks-icon" aria-hidden="true">✓</div>
      <h1>お問い合わせありがとうございました。</h1>
      <p>担当者より、平日9:30〜18:30の営業時間内に順次ご連絡いたします。<br>土日・祝日にいただいたお問い合わせは、翌営業日より順次対応いたします。</p>
      <p class="thanks-tel">ご連絡は、フリーダイヤル <a href="tel:08008052440">0800-805-2440</a> からお電話いたします。</p>
      <a class="button button-primary" href="index.html">メインページへ戻る</a>
    </article>
  </main>
</body>
</html>
