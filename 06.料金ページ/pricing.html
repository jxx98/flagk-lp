<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlagK — 料金・費用シミュレーター</title>
</head>
<body>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:     #0E1E30;
  --navy:    #1C3A5E;
  --slate:   #4A647E;
  --horizon: #E4EDF6;
  --sky:     #F0F5FB;
  --amber:   #E08B28;
  --amber-lt:#FFF4E6;
  --ground:  #F4F7FA;
  --white:   #FFFFFF;
  --sep:     #D0DCE8;
  --free-bg: #EBF5EC;
  --free-fg: #2C7A35;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", "Noto Sans JP", sans-serif;
  background: var(--ground);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Page header ─────────────────────── */
.page-header {
  background: var(--navy);
  padding: 28px 48px 24px;
  display: flex;
  align-items: baseline;
  gap: 28px;
  border-bottom: 3px solid var(--amber);
}

.brand {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--amber);
}

.header-divider {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.2);
  flex-shrink: 0;
  align-self: center;
}

.header-text h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.02em;
  margin-bottom: 2px;
}

.header-text p {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.01em;
}

/* ── Layout ──────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 28px;
  max-width: 1060px;
  margin: 0 auto;
  padding: 28px 24px 48px;
  align-items: start;
}

/* ── Catalog (left) ──────────────────── */
.catalog-intro {
  font-size: 12.5px;
  color: var(--slate);
  padding-bottom: 20px;
  border-bottom: 1px solid var(--sep);
  margin-bottom: 28px;
  line-height: 1.7;
}

.catalog-intro strong {
  color: var(--ink);
  font-weight: 600;
}

.category { margin-bottom: 28px; }

.category-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.cat-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--navy);
  color: var(--white);
  padding: 3px 10px 2px;
  flex-shrink: 0;
}

.cat-label.free { background: var(--free-fg); }

.cat-desc {
  font-size: 11.5px;
  color: var(--slate);
  margin-bottom: 8px;
  padding-left: 2px;
}

.cat-rule {
  flex: 1;
  border: none;
  border-top: 1px solid var(--sep);
}

.service-items { display: flex; flex-direction: column; gap: 2px; }

.svc {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 13px 14px;
  background: var(--white);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  user-select: none;
}

.svc:hover { background: var(--sky); }

.svc.selected {
  border-left-color: var(--amber);
  background: var(--amber-lt);
}

.svc input[type="checkbox"] {
  width: 15px;
  height: 15px;
  margin-top: 2px;
  accent-color: var(--amber);
  cursor: pointer;
  flex-shrink: 0;
}

.svc-info { min-width: 0; }

.svc-name {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
}

.svc-desc {
  font-size: 11.5px;
  color: var(--slate);
  margin-top: 3px;
  line-height: 1.5;
}

.qty-row {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--horizon);
}

.qty-row.on { display: flex; }

.qty-row label {
  font-size: 11.5px;
  color: var(--slate);
  white-space: nowrap;
}

.qty-row input[type="number"] {
  width: 52px;
  padding: 3px 6px;
  border: 1px solid var(--sep);
  background: var(--white);
  font-size: 13px;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: var(--ink);
}

.qty-row input[type="number"]:focus {
  outline: 2px solid var(--amber);
  border-color: transparent;
}

.qty-sub {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.svc-price-col {
  text-align: right;
  flex-shrink: 0;
  padding-top: 1px;
}

.svc-price {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  display: block;
}

.svc-price.free-tag {
  font-size: 11px;
  font-weight: 700;
  color: var(--free-fg);
  background: var(--free-bg);
  padding: 2px 7px;
  letter-spacing: 0.04em;
}

.svc-unit {
  font-size: 10.5px;
  color: var(--slate);
  margin-top: 2px;
  text-align: right;
}

/* ── Estimate panel (right) ──────────── */
.estimate-panel {
  position: sticky;
  top: 20px;
  background: var(--white);
  border: 1px solid var(--sep);
}

.est-header {
  background: var(--navy);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.est-header-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}

.est-header-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.02em;
}

.est-badge {
  font-size: 11px;
  font-weight: 700;
  background: var(--amber);
  color: var(--white);
  border-radius: 9999px;
  padding: 2px 9px;
  display: none;
  font-variant-numeric: tabular-nums;
}

.est-badge.on { display: block; }

.est-body { padding: 0; }

.est-empty {
  padding: 36px 24px;
  text-align: center;
  border-bottom: 1px solid var(--horizon);
}

.est-empty-icon {
  width: 40px;
  height: 40px;
  margin: 0 auto 12px;
  opacity: 0.25;
}

.est-empty p {
  font-size: 12.5px;
  color: var(--slate);
  line-height: 1.6;
}

.est-lines {
  display: none;
  flex-direction: column;
  border-bottom: 1px solid var(--sep);
}

.est-lines.on { display: flex; }

.est-line {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: baseline;
  padding: 10px 20px;
  border-bottom: 1px solid var(--horizon);
}

.est-line:last-child { border-bottom: none; }

.est-line-name {
  font-size: 12.5px;
  color: var(--ink);
  font-weight: 500;
}

.est-line-qty {
  font-size: 11px;
  color: var(--slate);
  margin-top: 2px;
}

.est-line-amount {
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.est-line-amount.free {
  font-size: 11px;
  font-weight: 700;
  color: var(--free-fg);
}

.est-total {
  background: var(--horizon);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--sep);
}

.est-total-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 0.03em;
}

.est-total-amount {
  font-size: 24px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.est-footer { padding: 16px 20px 20px; }

.est-note {
  font-size: 10.5px;
  color: var(--slate);
  line-height: 1.8;
  margin-bottom: 14px;
}

.est-cta {
  display: block;
  width: 100%;
  padding: 13px;
  background: var(--amber);
  color: var(--white);
  font-size: 13.5px;
  font-weight: 700;
  font-family: inherit;
  border: none;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: background 0.12s;
  margin-bottom: 8px;
}

.est-cta:hover { background: #C97820; }
.est-cta:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

.est-reset {
  display: block;
  width: 100%;
  padding: 9px;
  background: none;
  border: 1px solid var(--sep);
  color: var(--slate);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.12s, color 0.12s;
}

.est-reset:hover { border-color: var(--slate); color: var(--ink); }
.est-reset:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

/* ── Footer ─────────────────────────── */
.page-footer {
  text-align: center;
  padding: 24px;
  font-size: 11.5px;
  color: var(--slate);
  border-top: 1px solid var(--sep);
}

/* ── Mobile ─────────────────────────── */
@media (max-width: 780px) {
  .page-header { padding: 20px 16px; gap: 16px; flex-wrap: wrap; }
  .header-divider { display: none; }
  .layout { grid-template-columns: 1fr; padding: 16px; gap: 20px; }
  .estimate-panel { position: static; order: -1; }
  .svc { grid-template-columns: 18px 1fr auto; gap: 8px; padding: 11px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .svc, .est-cta, .est-reset { transition: none; }
}
</style>

<header class="page-header">
  <span class="brand">FlagK</span>
  <div class="header-divider"></div>
  <div class="header-text">
    <h1>料金・費用シミュレーター</h1>
    <p>作業内容を選択すると、概算費用をご確認いただけます</p>
  </div>
</header>

<div class="layout">
  <!-- Catalog -->
  <section>
    <p class="catalog-intro">
      各項目をクリックして選択してください。<strong>複数選択可能</strong>です。

    </p>
    <div id="catalog"></div>
  </section>

  <!-- Estimate panel -->
  <aside class="estimate-panel">
    <div class="est-header">
      <div>
        <div class="est-header-label">概算見積もり</div>

      </div>

    </div>
    <div class="est-body">
      <div class="est-empty" id="empty">
        <svg class="est-empty-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="5" width="24" height="30" rx="1.5" stroke="#1C3A5E" stroke-width="2"/>
          <line x1="13" y1="13" x2="27" y2="13" stroke="#1C3A5E" stroke-width="1.5"/>
          <line x1="13" y1="18" x2="27" y2="18" stroke="#1C3A5E" stroke-width="1.5"/>
          <line x1="13" y1="23" x2="22" y2="23" stroke="#1C3A5E" stroke-width="1.5"/>

        <span class="est-total-amount" id="total">¥0</span>
      </div>
      <div class="est-footer">
        <p class="est-note">
          ※ 上記はあくまで目安です。実際の作業規模・難易度により変動します。<br>
          ※ 複数の作業をまとめてご依頼いただく場合は、ご相談に応じます。
        </p>
        <button class="est-cta" onclick="handleContact()">この内容でお問い合わせする</button>
        <button class="est-reset" onclick="resetAll()">選択をリセット</button>
      </div>
    </div>
  </aside>
</div>

<footer class="page-footer">© FlagK — 料金はすべて税込表示です</footer>

<script>
const SERVICES = [
  {
    id: 'content',
    label: '文言・素材',
    free: false,
    desc: 'テキストや画像素材の変更',
    items: [
      { id: 'text',  name: 'テキスト・文言の修正',     desc: 'キャッチコピー・説明文・CTAテキストなどの変更', price: 0,     unit: null },
      { id: 'photo', name: '写真・画像の差し替え',      desc: 'ヒーロー画像・バナー・商品写真の入れ替え',     price: 3000,  unit: '点'  },
      { id: 'logo',  name: 'ロゴ・アイコンの差し替え', desc: 'ロゴ画像・SVGアイコン素材の入れ替え',           price: 3000,  unit: null  }
    ]
  },
  {
    id: 'design',
    label: 'デザイン・見た目',
    free: false,
    desc: 'ビジュアルデザインの変更',
    items: [
      { id: 'color',   name: '色・配色の変更',          desc: 'メインカラー・ボタン色・背景色などの変更',           price: 3000,  unit: null },
      { id: 'font',    name: 'フォント・文字サイズ変更', desc: '書体の変更、見出し・本文のサイズ・太さ調整',         price: 3000,  unit: null },
      { id: 'btn-sty', name: 'ボタンのデザイン変更',    desc: '形・色・サイズ・文言の変更',                        price: 5000,  unit: null },
      { id: 'layout',  name: '余白・レイアウトの調整',  desc: '要素の配置・間隔・整列の微調整',                    price: 5000,  unit: null },
      { id: 'sp',      name: 'スマホ表示の最適化',      desc: 'モバイルでの表示崩れ修正・レイアウト改善',           price: 8000,  unit: null }
    ]
  },
  {
    id: 'section',
    label: 'セクション構成',
    free: false,
    desc: 'ページのセクション単位の作業',
    items: [
      { id: 'sec-edit', name: 'セクション内容の更新',         desc: '既存セクションのデザイン・構成・内容の変更',                   price: 5000,  unit: null },
      { id: 'sec-add',  name: '新規セクションの追加',          desc: '実績・FAQ・料金表など新しいセクションのデザイン・実装',        price: 10000, unit: '個'  },
      { id: 'sec-del',  name: 'セクションの削除・並び替え',    desc: '不要セクションの削除や表示順序の変更',                        price: 3000,  unit: null },
      { id: 'hero',     name: 'ファーストビューの改修',        desc: 'ヒーローエリアのデザイン・コピー・CTAを全面改修',              price: 15000, unit: null },
      { id: 'cta',      name: 'CTAの追加・最適化',             desc: '問い合わせボタン・フォームへの導線の追加・改善',               price: 5000,  unit: null }
    ]
  },
  {
    id: 'form',
    label: 'フォーム・問い合わせ',
    free: false,
    desc: 'フォームや送信機能の作業',
    items: [
      { id: 'form-item',   name: 'フォーム項目の追加・変更',   desc: '入力項目の追加・削除・ラベル変更・並び替え',               price: 5000,  unit: null },
      { id: 'form-action', name: '送信後の動作変更',            desc: 'サンクスページの変更・自動返信メール文の修正',              price: 5000,  unit: null },
      { id: 'form-new',    name: '新規フォームの作成',          desc: '問い合わせ・資料請求・予約フォームの設計・実装・メール通知', price: 15000, unit: null },
      { id: 'form-sheet',  name: 'スプレッドシート自動記録',    desc: 'フォーム送信内容をGoogleスプレッドシートに自動記録',        price: 10000, unit: null }
    ]
  },
  {
    id: 'tracking',
    label: '計測・広告連携',
    free: false,
    desc: 'アクセス解析・広告タグの設定',
    items: [
      { id: 'ga4',     name: 'Google Analytics 4（GA4）設置',   desc: 'GA4計測コードの設置と基本イベントの設定',               price: 8000,  unit: null },
      { id: 'gads-cv', name: 'Google広告 コンバージョン設定',   desc: 'CVタグの設置・フォーム連携・計測テスト',                price: 10000, unit: null },
      { id: 'gtm',     name: 'GTM（タグマネージャー）設定',     desc: 'GTMコンテナの設置・タグ管理の設定',                     price: 10000, unit: null },
      { id: 'meta-px', name: 'Meta広告 ピクセル設置',           desc: 'Metaピクセルの設置・コンバージョンイベント設定',         price: 8000,  unit: null }
    ]
  },
  {
    id: 'new',
    label: '新規制作・大規模改修',
    free: false,
    desc: 'ページ新規制作・LP全体改修',
    items: [
      { id: 'lp-reform', name: 'LP大規模改修（構成・デザイン全面刷新）', desc: '構成・デザイン・コピーを包括的に見直す全体改修',                          price: 30000, unit: null },
      { id: 'lp-new',    name: 'LP新規制作',                             desc: '広告・集客用LPの企画〜コーディング・Xserver公開まで',                    price: 30000, unit: null },
      { id: 'hp-new',    name: 'HP新規制作（3〜5ページ）',               desc: 'コーポレートサイト・サービスサイトの設計・制作',                          price: 80000, unit: null }
    ]
  }
];

// Flat lookup
const ITEM_MAP = {};
SERVICES.forEach(cat => cat.items.forEach(item => { ITEM_MAP[item.id] = item; }));

// State: Map<id, qty>
const selected = new Map();

function fmtYen(n) {
  return '¥' + n.toLocaleString('ja-JP');
}

/* Build catalog HTML */
function buildCatalog() {
  const root = document.getElementById('catalog');

  SERVICES.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'category';

    const hdr = document.createElement('div');
    hdr.className = 'category-header';
    hdr.innerHTML = `<span class="cat-label${cat.free ? ' free' : ''}">${cat.label}</span><hr class="cat-rule">`;
    section.appendChild(hdr);

    if (cat.desc) {
      const descEl = document.createElement('p');
      descEl.className = 'cat-desc';
      descEl.textContent = cat.desc;
      section.appendChild(descEl);
    }

    const list = document.createElement('div');
    list.className = 'service-items';
    section.appendChild(list);

    cat.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'svc';
      row.id = 'svc-' + item.id;

      const priceHtml = item.price === 0
        ? `<span class="svc-price free-tag">無料</span>`
        : `<span class="svc-price">${fmtYen(item.price)}${item.price >= 10000 ? '' : ''}</span>${item.unit ? `<div class="svc-unit">/ ${item.unit}</div>` : ''}`;

      row.innerHTML = `
        <input type="checkbox" id="chk-${item.id}">
        <div class="svc-info">
          <div class="svc-name">${item.name}</div>
          <div class="svc-desc">${item.desc}</div>
          ${item.unit ? `
            <div class="qty-row" id="qrow-${item.id}">
              <label for="qty-${item.id}">${item.unit}数</label>
              <input type="number" id="qty-${item.id}" min="1" max="99" value="1">
              <span class="qty-sub" id="qsub-${item.id}">${fmtYen(item.price)}</span>
            </div>` : ''}
        </div>
        <div class="svc-price-col">${priceHtml}</div>
      `;

      list.appendChild(row);

      const chk = row.querySelector('input[type="checkbox"]');

      chk.addEventListener('change', () => {
        setItem(item, chk.checked);
        row.classList.toggle('selected', chk.checked);
        if (item.unit) {
          document.getElementById('qrow-' + item.id).classList.toggle('on', chk.checked);
        }
      });

      if (item.unit) {
        const qInput = row.querySelector('#qty-' + item.id);
        qInput.addEventListener('input', () => {
          const q = Math.max(1, parseInt(qInput.value) || 1);
          qInput.value = q;
          if (selected.has(item.id)) {
            selected.set(item.id, q);
            document.getElementById('qsub-' + item.id).textContent = fmtYen(item.price * q);
            renderEstimate();
          }
        });
        qInput.addEventListener('click', e => e.stopPropagation());
        qInput.addEventListener('change', e => e.stopPropagation());
      }

      row.addEventListener('click', e => {
        if (e.target.tagName === 'INPUT') return;
        chk.checked = !chk.checked;
        chk.dispatchEvent(new Event('change'));
      });
    });

    root.appendChild(section);
  });
}

function setItem(item, on) {
  if (on) {
    const qEl = document.getElementById('qty-' + item.id);
    selected.set(item.id, item.unit ? (parseInt(qEl?.value) || 1) : 1);
  } else {
    selected.delete(item.id);
  }
  renderEstimate();
}

function renderEstimate() {
  const emptyEl  = document.getElementById('empty');
  const linesEl  = document.getElementById('lines');
  const totalEl  = document.getElementById('total');
  const badgeEl  = document.getElementById('badge');
  const count    = selected.size;

  badgeEl.textContent = count + '件';
  badgeEl.classList.toggle('on', count > 0);

  if (count === 0) {
    emptyEl.style.display = '';
    linesEl.classList.remove('on');
    linesEl.innerHTML = '';
    totalEl.textContent = '¥0';
    return;
  }

  emptyEl.style.display = 'none';
  linesEl.classList.add('on');
  linesEl.innerHTML = '';

  let total = 0;
  selected.forEach((qty, id) => {
    const item = ITEM_MAP[id];
    if (!item) return;
    const amount = item.price * qty;
    total += amount;

    const line = document.createElement('div');
    line.className = 'est-line';
    const amtCls = item.price === 0 ? 'est-line-amount free' : 'est-line-amount';
    const amtTxt = item.price === 0 ? '無料' : fmtYen(amount);
    const qtyTxt = item.unit && qty > 1 ? `${qty} ${item.unit}` : '';
    line.innerHTML = `
      <div>
        <div class="est-line-name">${item.name}</div>
        ${qtyTxt ? `<div class="est-line-qty">${qtyTxt}</div>` : ''}
      </div>
      <div class="${amtCls}">${amtTxt}</div>
    `;
    linesEl.appendChild(line);
  });

  totalEl.textContent = fmtYen(total);
}

function resetAll() {
  selected.clear();
  document.querySelectorAll('.svc input[type="checkbox"]').forEach(c => { c.checked = false; });
  document.querySelectorAll('.svc').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.qty-row').forEach(el => el.classList.remove('on'));
  document.querySelectorAll('.qty-row input[type="number"]').forEach(el => { el.value = 1; });
  document.querySelectorAll('.qty-sub').forEach((el, i) => {
    const id = el.id.replace('qsub-', '');
    if (ITEM_MAP[id]) el.textContent = fmtYen(ITEM_MAP[id].price);
  });
  renderEstimate();
}

function handleContact() {
  if (selected.size === 0) {
    alert('作業内容を選択してください。');
    return;
  }
  const lines = [];
  selected.forEach((qty, id) => {
    const item = ITEM_MAP[id];
    if (!item) return;
    lines.push(item.unit ? `・${item.name}（${qty}${item.unit}）` : `・${item.name}`);
  });
  const total = Array.from(selected.entries()).reduce((sum, [id, qty]) => {
    return sum + (ITEM_MAP[id]?.price || 0) * qty;
  }, 0);
  const msg = `以下の作業についてお問い合わせしたいです。\n\n${lines.join('\n')}\n\n概算合計：${fmtYen(total)}`;
  if (typeof sendPrompt === 'function') {
    sendPrompt(msg);
  } else {
    alert(msg);
  }
}

buildCatalog();
renderEstimate();
</script>
